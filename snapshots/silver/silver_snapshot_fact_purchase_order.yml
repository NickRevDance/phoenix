version: 2

snapshots:
  - name: silver_snapshot_fact_purchase_order
    relation: ref('silver_stage_fact_purchase_order')

    description: >
      Type 2 history of purchase order lines (FACT_PURCHASE_ORDER v1.0). A version is created
      when po_change_hash changes: line or header status, ordered quantity, unit price,
      currency, requested or confirmed delivery date, remaining physical quantity, received,
      cancelled, invoiced or in-transit quantity, last receipt date, vendor account,
      manufacturing status or transit status.

    config:
      schema: silver_history
      unique_key: purchase_order_entity_key
      strategy: check
      hard_deletes: invalidate  # EDW-8 standardization (2026-09-17, Nick's decision): house default is invalidate, not ignore

      check_cols:
        - po_change_hash

      snapshot_meta_column_names:
        dbt_valid_from: effective_start_datetime
        dbt_valid_to: effective_end_datetime
        dbt_scd_id: row_hash
        dbt_updated_at: etl_update_datetime
