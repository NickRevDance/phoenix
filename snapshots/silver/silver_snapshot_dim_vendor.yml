version: 2

snapshots:
  - name: silver_snapshot_dim_vendor
    relation: ref('silver_stage_dim_vendor')

    description: >
      Type 2 historical snapshot of DIM_VENDOR. A new version is created
      whenever a tracked vendor attribute (name, group, payment terms,
      currency, incoterm, status) changes for a given vendor_id.


    config:
      schema: silver_history
      unique_key: vendor_key
      strategy: check
      hard_deletes: ignore

      check_cols:
        - vendor_change_hash

      snapshot_meta_column_names:
        dbt_valid_from: effective_start_datetime
        dbt_valid_to: effective_end_datetime
        dbt_scd_id: row_hash
        dbt_updated_at: etl_update_datetime