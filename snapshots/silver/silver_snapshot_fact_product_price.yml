version: 2

snapshots:
  - name: silver_snapshot_fact_product_price
    relation: ref('silver_stage_fact_product_price')

    description: >
      v1.1 rebuild (EDW-20). Narrower job than a standard SCD2 snapshot in
      this project: price *history* now loads natively from the source's
      own FROMDATE/TODATE windows (every window is already its own row in
      silver_stage_fact_product_price), so this snapshot no longer creates
      history -- it exists for exactly one purpose (spec Section 3.2):
      catching an in-place edit to an already-loaded window, i.e. D365
      changing a trade agreement's AMOUNT without opening a new FROMDATE.
      Because product_price_entity_key includes effective_date, a closed
      historical window's business key never repeats and it gets exactly
      one permanent snapshot version; an open window's key is stable
      across runs, so if its list_price changes in place, check_cols
      catches it and versions it -- the corrected amount becomes the
      window's current value without a new native row for it to live in.

    config:
      schema: silver_history
      unique_key: product_price_entity_key
      strategy: check
      # v1.1 change from v1.0 (which used 'ignore'): a hard-deleted
      # PriceDiscTable row -- a withdrawn agreement -- should stop being
      # current rather than staying open forever with a stale price.
      hard_deletes: invalidate

      check_cols:
        - price_change_hash

      snapshot_meta_column_names:
        dbt_valid_from: effective_start_datetime
        dbt_valid_to: effective_end_datetime
        dbt_scd_id: row_hash
        dbt_updated_at: etl_update_datetime
