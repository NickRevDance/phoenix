version: 2

snapshots:
  - name: silver_snapshot_fact_product_price
    relation: ref('silver_stage_fact_product_price')

    description: >
      Type 2 historical snapshot of product price records. A new version is
      created whenever a tracked price measure changes for a given
      product_id + price_type + source_system (e.g. D365 list price is
      updated, or a promotional sale price is superseded).

    config:
      schema: silver_history
      unique_key: product_price_entity_key
      strategy: check
      hard_deletes: ignore

      check_cols:
        - price_change_hash

      snapshot_meta_column_names:
        dbt_valid_from: effective_start_datetime
        dbt_valid_to: effective_end_datetime
        dbt_scd_id: row_hash
        dbt_updated_at: etl_update_datetime
