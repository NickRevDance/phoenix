version: 2

seeds:
  - name: demand_planning_thresholds_seed
    description: >
      Business-maintained source of record for REF_DEMAND_PLANNING_THRESHOLDS
      (FACT_ORDER_LINE spec 9.2, EDW-150). Four active parameters for the
      demand_trend_flag and demand_yoy_flag rules on V_DEMAND_PLANNING
      (EDW-61), at the defaults ratified in the Phase 2 Orders and Sales
      decisions (O9, effective 2026-09-23). A change is a new row with a new
      effective_start_date and the old row closed, not a rebuild. All
      columns loaded as string; ref_demand_planning_thresholds casts real
      types.
    config:
      column_types:
        parameter_name: string
        parameter_value: string
        unit: string
        is_active: string
        effective_start_date: string
        effective_end_date: string
        notes: string