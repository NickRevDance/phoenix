version: 2

models:
  - name: dim_date
    description: >
      Gold Layer conformed date dimension per DIM_DATE Specification v2.0.
      One row per calendar date, 2005-01-01 through 2036-12-31 (11,688 rows).
      Calendar, fiscal (July 1 start), and NRF 4-5-4 retail calendars in one
      table. Dynamic flags are recomputed on every run and are excluded from
      the Type 0 guarantee.
    columns:
      - name: date_key
        description: Surrogate integer key (YYYYMMDD). Primary key and FK target for all fact tables.
        tests: [unique, not_null]
      - name: date
        description: Calendar date. Natural / alternate key. Power BI date table key.
        tests: [unique, not_null]
      - name: retail_year
        description: NRF 4-5-4 retail year from the authoritative seed.
        tests: [not_null]
      - name: retail_week
        tests: [not_null]
      - name: retail_period
        tests: [not_null]
      - name: fiscal_year
        tests: [not_null]
      - name: is_working_day
        tests: [not_null]

  - name: stg_holiday_calendar
    description: >
      One row per calendar date pivoted from the long-form holiday_calendar
      seed. calendar_type is resolved into explicit columns here and does not
      survive the pivot (spec Section 8).
    columns:
      - name: date
        tests: [unique, not_null]
      - name: is_company_working_day
        description: Drives DIM_DATE.is_working_day. Only Company seed rows affect it.
        tests: [not_null]

  - name: dim_sales_channel
    description: >
      DIM_SALES_CHANNEL -- conformed sales channel dimension (Type 1,
      seed-based). See models/dim_sales_channel/README.md (staging copy,
      Revolution Dance project folder) for build status and open decisions.
    columns:
      - name: channel_code
        tests:
          - unique
          - not_null
          - relationship_coverage:
              to: ref('ref_sales_origin_map')
              field: channel_code
              where: "channel_status = 'Active'"

  - name: ref_sales_origin_map
    description: >
      REF_SALES_ORIGIN_MAP -- crosswalk of D365 SalesOriginId values to
      DIM_SALES_CHANNEL. See models/ref_sales_origin_map/README.md (staging
      copy, Revolution Dance project folder) for build status and open
      decisions.
    columns:
      - name: sales_origin_id
        tests: [unique, not_null]
      - name: channel_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_sales_channel')
              field: channel_code
      - name: mapping_confidence
        tests:
          - accepted_values:
              values: ['Confirmed', 'Provisional']
      - name: source_system
        tests: [not_null]
      - name: is_active_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
