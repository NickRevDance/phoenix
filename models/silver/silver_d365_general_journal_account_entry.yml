version: 2

models:
  - name: silver_d365_general_journal_account_entry
    description: >
      D365 GeneralJournalAccountEntry -- one row per general ledger line. Joins to
      silver_d365_general_journal_entry on GENERALJOURNALENTRY = RECID.
      MAINACCOUNTID is the first segment of LEDGERACCOUNT.
    columns:
      - name: RECID
        data_tests:
          - unique
          - not_null
      - name: GENERALJOURNALENTRY
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_d365_general_journal_entry')
                field: RECID
              config:
                severity: warn  # a line can sync a run ahead of its header
      - name: MAINACCOUNT
        data_tests:
          - not_null
      - name: MAINACCOUNTID
        data_tests:
          - not_null
      - name: LEDGERACCOUNT
        data_tests:
          - not_null
      - name: ACCOUNTINGCURRENCYAMOUNT
        data_tests:
          - not_null
