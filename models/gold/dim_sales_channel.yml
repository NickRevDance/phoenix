version: 2

models:
  - name: dim_sales_channel
    description: >
      DIM_SALES_CHANNEL -- conformed sales channel dimension (Type 1,
      seed-based). Rebuilt to spec v1.1 (EDW-77, 2026-09-14). See
      README.md for build status and open decisions.
    columns:
      - name: sales_channel_key
        tests:
          - is_valid_key
      - name: channel_code
        tests:
          - is_valid_key
          - relationship_coverage:
              to: ref('ref_sales_origin_map')
              field: channel_code
              where: "channel_status = 'Active' and channel_code not in ('B2B_DIRECT', 'INTERNAL', 'UNKNOWN', 'NO_SALES_CHANNEL')"
              config:
                severity: error  # promoted 2026-09-16: REF_SALES_ORIGIN_MAP v1.1 (EDW-16) now maps NIMBLY_S2C/NIMBLY_S2S to their own channel rows and BC_TT is Planned -- both gaps that kept this at warn are closed.
      - name: channel_type
        tests:
          - accepted_values:
              values: ['Ecommerce', 'Call Center', 'B2B Direct', 'Internal', 'Reserved']
      - name: channel_status
        tests:
          - accepted_values:
              values: ['Active', 'Inactive', 'Planned']

  - name: v_dim_sales_channel_current
    description: >
      Column-projection pass-through over dim_sales_channel (Type 1, no version history),
      kept so every dimension exposes a _current view for Power BI.
    columns:
      - name: sales_channel_key
        tests:
          - is_valid_key:  # EDW-132 section 6, at warn first
              config:
                severity: warn