version: 2

models:
  - name: ref_sales_origin_map
    description: >
      REF_SALES_ORIGIN_MAP -- crosswalk of D365 SalesOriginId values to
      DIM_SALES_CHANNEL. See README.md for build status and open decisions.
    columns:
      - name: sales_origin_id
        tests: [unique, not_null]
      - name: channel_code
        tests:
          - not_null
          - relationships:
              to: ref('dim_sales_channel')
              field: channel_code
      - name: mapping_confidence
        tests:
          - accepted_values:
              values: ['Confirmed', 'Provisional']
      - name: source_system
        tests: [not_null]
      - name: is_active_flag
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
