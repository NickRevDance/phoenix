version: 2

models:
  - name: dim_vendor
    description: >
      DIM_VENDOR -- SCD Type 2 gold-layer vendor dimension, versioned
      history (one row per vendor_key version; see v_dim_vendor_current
      for the current-row-only view). Sourced from D365 VendTable +
      DirPartyTable, filtered to VENDGROUP not in (NIM, Customer,
      Employee) to exclude non-supplier AP payees. Every remaining AP
      vendor is kept and classified by vendor_type, derived from
      vendor_group (Inventory = Merchandise Supplier, Interco =
      Intercompany, blank = Unclassified, all others = Service
      Provider); the stage filter is not narrowed further. Includes
      two reserved members (UNKNOWN=-1, NO_VENDOR=0). Address fields
      (line 1/2, city, state, postal code, country code) come from the
      primary postal address (EDW-92); contact name, lead time,
      compliance tracking and the quality scorecard are null-cast
      pending source availability -- see
      README.md for the full field-by-field status. Type 1 attributes
      are read from the current silver_stage_dim_vendor row; vendor_start_date
      and vendor_end_date are the vendor lifecycle dates (no D365 source
      yet), distinct from the SCD2 effective_*_datetime columns.
    tests:
      # EDW-132 sections 1 and 2: one current row per key and no overlapping version ranges, at warn first
      - one_current_row_per_key:
          name: dim_vendor_one_current_row_per_key
          arguments:
            key_columns: ['vendor_key']
          config:
            severity: warn
      - no_overlapping_effective_periods:
          name: dim_vendor_no_overlapping_effective_periods
          arguments:
            partition_by: ['vendor_key']
            from_column: effective_start_datetime
            to_column: effective_end_datetime
          config:
            severity: warn
    columns:
      - name: vendor_id
        tests:
          - not_null
      - name: vendor_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Merchandise Supplier', 'Intercompany', 'Service Provider', 'Unclassified', 'Reserved']
      - name: vendor_status
        tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Suspended', 'Blocked', 'Payment Blocked', 'Requisition Blocked', 'Never Blocked', 'Unknown']
      # EDW-132: no empty strings on the contact fields (the model returns NULL where D365 sends ''), at warn first
      - name: primary_contact_email
        tests:
          - dbt_utils.not_empty_string:
              config:
                severity: warn
      - name: primary_contact_phone
        tests:
          - dbt_utils.not_empty_string:
              config:
                severity: warn

  - name: v_dim_vendor_current
    description: >
      Current-row view over dim_vendor (is_current_row = 1, meaning
      version_number = 1 with an open effective_end_datetime) with SCD2
      and internal metadata columns stripped -- the object most
      consumers (Power BI, ad hoc analysts) should query. The open-end
      test matters because silver_snapshot_dim_vendor runs
      hard_deletes: invalidate, so a vendor removed from D365 keeps
      version_number = 1 on a closed row (EDW-91).
    columns:
      - name: vendor_key
        tests:
          - is_valid_key