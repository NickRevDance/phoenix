version: 2

models:
  - name: fact_order_line
    description: >
      FACT_ORDER_LINE -- immutable as-ordered demand snapshot, insert-only
      accumulating fact (D365 SalesLine + SalesTable). See README.md for
      build status, known gaps, and open decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:  # EDW-21 v1.1 (2026-10-07, spec Section 3 / 7.7): grain is order_id + d365_sales_line_rec_id, not order_id + order_line_number -- same rec_id-grain test as FACT_ORDERS_RETURNS.
          arguments:
            combination_of_columns:
              - order_id
              - d365_sales_line_rec_id
    columns:
      - name: order_line_key
        tests: [is_valid_key]
      - name: order_id
        tests: [not_null]
      - name: order_line_number
        description: SalesLine.LINENUM as DECIMAL(10,4). Fractional when D365 inserts a line between existing lines. Display and sort attribute, not the grain. EDW-21.
        tests: [not_null]
      - name: d365_sales_line_rec_id
        description: SalesLine RECID. Grain component with order_id and the join key to FACT_ORDERS_RETURNS. EDW-21.
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">0"
                error_if: ">5"   # known D365 header-sync gap (see project
                                 # memory / dq_exceptions_framework README) --
                                 # a handful is a source-system gap to chase,
                                 # not a model bug; a spike past 5 means
                                 # something upstream actually broke
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: unresolved_upc
        description: D365 barcode (UPC) that had no DIM_PRODUCT row, so product_key is -1. NULL when product_key resolved or no barcode exists. EDW-134.
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                severity: error  # EDW-134 (2026-10-05): every product_key now exists in dim_product ('-1' is a real member); was warn. Prior note: -1 unresolved-to-barcode rows are
                # are expected by design (same convention as
                # fact_product_price) and would always fail a hard
                # relationships test -- see that model's yml for the same
                # pattern. Chris's 2026-09-16 review also flagged this
                # column's relationships test as pointing at the wrong
                # target on an earlier read; confirmed here it already
                # targets dim_customer/dim_product directly, not a silver
                # snapshot -- no code change needed, noting for the record.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (EDW-16 v1.1 rebuild): never NULL
                            # since sales_channel_key is coalesced to -1 above,
                            # same as fact_sales_invoice.
      - name: ordered_qty
        tests: [not_null]
      - name: net_line_amount
        tests: [not_null]

# EDW-21 v1.1 (2026-10-07): uniqueness is tested on order_id +
# d365_sales_line_rec_id (model-level test above) and on order_line_key.
# There is no uniqueness test on order_id + order_line_number by design
# (spec 7.7): lines deleted in D365 and re-created under the same LINENUM
# are both kept, so that combination repeats.
#
# 2026-09-16: customer_key not_null converted to warn (threshold error_if
# >5) instead of hard error, per the project-wide dq_exceptions_framework
# (see maintenance/dq_exceptions_framework_2026-09-16/README.md) -- flags
# the known SO-3715780-style header-sync gap for remediation via
# v_dq_open_exceptions instead of failing the whole Prod Daily job on it.