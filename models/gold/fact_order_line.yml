version: 2

models:
  - name: fact_order_line
    description: >
      FACT_ORDER_LINE -- immutable as-ordered demand snapshot, insert-only
      accumulating fact (D365 SalesLine + SalesTable). See README.md for
      build status, known gaps, and open decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:  # EDW-21 v1.1 (2026-10-07, spec Section 3 / 7.7): grain is order_id + d365_sales_line_rec_id, not order_id + order_line_number -- same rec_id-grain test as FACT_ORDERS_RETURNS.
          arguments:
            combination_of_columns:
              - order_id
              - d365_sales_line_rec_id
    columns:
      - name: order_line_key
        tests: [is_valid_key]
      - name: order_id
        tests: [not_null]
      - name: order_line_number
        description: SalesLine.LINENUM as DECIMAL(10,4). Fractional when D365 inserts a line between existing lines. Display and sort attribute, not the grain. EDW-21.
        tests: [not_null]
      - name: d365_sales_line_rec_id
        description: SalesLine RECID. Grain component with order_id and the join key to FACT_ORDERS_RETURNS. EDW-21.
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: unresolved_upc
        description: D365 barcode (UPC) that had no DIM_PRODUCT row, so product_key is -1. NULL when product_key resolved or no barcode exists. EDW-134.
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                severity: error  # EDW-134 (2026-10-05): every product_key now exists in dim_product ('-1' is a real member); was warn. Prior note: -1 unresolved-to-barcode rows are
                # are expected by design (same convention as
                # fact_product_price) and would always fail a hard
                # relationships test -- see that model's yml for the same
                # pattern. Chris's 2026-09-16 review also flagged this
                # column's relationships test as pointing at the wrong
                # target on an earlier read; confirmed here it already
                # targets dim_customer/dim_product directly, not a silver
                # snapshot -- no code change needed, noting for the record.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (EDW-16 v1.1 rebuild): never NULL
                            # since sales_channel_key is coalesced to -1 above,
                            # same as fact_sales_invoice.
      - name: customer_segment_key
        description: >
          DIM_CUSTOMER_SEGMENT key of the order account when the line was written, held on later
          merges. History before EDW-56 reads the segment on the day of the refresh, and a full
          refresh restates it. NULL on the -1 customer. EDW-56.
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer_segment')
                field: customer_segment_key
              config:
                severity: warn  # same as fact_orders_returns (EDW-59)
      - name: is_dso_order_flag
        description: >
          DIM_CUSTOMER is_dso_member_flag on the customer version in effect at the order date.
          Membership history starts with the first customer snapshot (Oct 14 2026); earlier orders
          read that first version. NULL on the -1 customer. EDW-56.
        tests:
          - not_null:
              config:
                where: "customer_key <> -1"
                severity: warn
      - name: payment_terms_code
        description: SalesTable.PAYMENT conformed (spec 7.9). EDW-56.
        tests:
          - accepted_values:
              arguments:
                values: ['PREPAID', 'NET10', 'NET30', 'NET45', 'NET60', 'UNKNOWN']
      - name: payment_mode_code
        description: SalesTable.PAYMMODE as sourced, blank to NULL (spec 4.8). EDW-56.
        tests:
          - accepted_values:
              arguments:
                values: ['CC-BT', 'Credit', 'RevPoints', 'Check', 'ACH']
              config:
                severity: warn  # a new tender code surfaces here without stopping the run
      # EDW-56: both date keys relate to dim_date at error (were warn on EDW-132). A line with no
      # order header carries order_date_key -1, so the key is never NULL.
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: requested_ship_date_key
        description: NULL under the placeholder rule (spec 7.8); the relationships test skips those.
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: ordered_qty
        tests: [not_null]
      - name: net_line_amount
        tests: [not_null]

# EDW-21 v1.1 (2026-10-07): uniqueness is tested on order_id +
# d365_sales_line_rec_id (model-level test above) and on order_line_key.
# There is no uniqueness test on order_id + order_line_number by design
# (spec 7.7): lines deleted in D365 and re-created under the same LINENUM
# are both kept, so that combination repeats.
#
# EDW-135: customer_key is never NULL. Lines whose SalesTable header has not landed
# resolve to the dim_customer -1 member, and the self-heal in the model re-pulls
# them once the header arrives. not_null is a hard test again (was warn, error_if >5).