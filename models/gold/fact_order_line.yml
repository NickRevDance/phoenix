version: 2

models:
  - name: fact_order_line
    description: >
      FACT_ORDER_LINE -- immutable as-ordered demand snapshot, insert-only
      accumulating fact (D365 SalesLine + SalesTable). See README.md for
      build status, known gaps, and open decisions.
    columns:
      - name: order_line_key
        tests: [is_valid_key]
      - name: order_id
        tests: [not_null]
      - name: order_line_number
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">0"
                error_if: ">5"   # known D365 header-sync gap (see project
                                 # memory / dq_exceptions_framework README) --
                                 # a handful is a source-system gap to chase,
                                 # not a model bug; a spike past 5 means
                                 # something upstream actually broke
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
              config:
                severity: warn  # 2026-09-16: -1 unresolved-to-barcode rows
                # are expected by design (same convention as
                # fact_product_price) and would always fail a hard
                # relationships test -- see that model's yml for the same
                # pattern. Chris's 2026-09-16 review also flagged this
                # column's relationships test as pointing at the wrong
                # target on an earlier read; confirmed here it already
                # targets dim_customer/dim_product directly, not a silver
                # snapshot -- no code change needed, noting for the record.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (EDW-16 v1.1 rebuild): never NULL
                            # since sales_channel_key is coalesced to -1 above,
                            # same as fact_sales_invoice.
      - name: ordered_qty
        tests: [not_null]
      - name: net_line_amount
        tests: [not_null]

# Deferred, not implemented in this pass:
#   - order_id + order_line_number + source_system business-key uniqueness:
#     not tested directly (2 known live duplicates on this combination --
#     see README/SQL comment on order_line_key -- is_valid_key on the
#     surrogate key covers row-level uniqueness instead).
#
# 2026-09-16: customer_key not_null converted to warn (threshold error_if
# >5) instead of hard error, per the project-wide dq_exceptions_framework
# (see maintenance/dq_exceptions_framework_2026-09-16/README.md) -- flags
# the known SO-3715780-style header-sync gap for remediation via
# v_dq_open_exceptions instead of failing the whole Prod Daily job on it.
