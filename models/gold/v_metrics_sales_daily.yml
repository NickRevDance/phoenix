version: 2

models:
  - name: v_metrics_sales_daily
    description: >
      V_METRICS_SALES_DAILY (EDW-133) -- the certified daily sales metrics view over
      FACT_SALES_INVOICE. One row per invoice_date_key + product_key + customer_key +
      sales_channel_key + warehouse_key + transaction_currency_code + invoice_type +
      is_intercompany_flag + payment_terms_code + payment_mode_code + is_dso_order_flag. Every row of
      the fact is represented, including unresolved keys and Free Text lines, so each additive
      measure summed over the view equals the same sum over the fact. Ratios ship as numerator
      and denominator and are divided by the consumer. Transaction amounts are in
      transaction_currency_code and must not be summed across currencies. Revenue and discount
      totals include both invoice types; anything by product, units, ASP, cost or margin
      filters invoice_type = 'Sales Order'. See the model's header comment for the rules.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - invoice_date_key
              - product_key
              - customer_key
              - sales_channel_key
              - warehouse_key
              - transaction_currency_code
              - invoice_type
              - is_intercompany_flag  # EDW-59
              - payment_terms_code  # EDW-59
              - payment_mode_code  # EDW-59
              - is_dso_order_flag  # EDW-59
    columns:
      # Grain
      - name: invoice_date_key
        description: Invoice date as yyyyMMdd. Joins DIM_DATE.
        tests: [not_null]
      - name: product_key
        description: >
          DIM_PRODUCT key resolved on the barcode path. '-1' where the line has no barcode, which
          includes every Free Text line. '-1' also covers a barcode with no DIM_PRODUCT row (EDW-134); the UPC is kept in unresolved_upc on the fact.
        tests: [not_null]
      - name: customer_key
        description: DIM_CUSTOMER key of the invoice account.
        tests: [not_null]
      - name: sales_channel_key
        description: DIM_SALES_CHANNEL key. -1 (Unknown Channel) where the sales origin is blank or unmapped.
        tests: [not_null]
      - name: warehouse_key
        description: >
          DIM_WAREHOUSE key. NULL where the line resolves to no warehouse (Free Text lines and a
          few others) until DIM_WAREHOUSE carries its unknown member (EDW-90).
      - name: transaction_currency_code
        description: Currency of the transaction amounts on the row (USD or CAD). In the grain so the two are never summed in one cell.
        tests: [not_null]
      - name: invoice_type
        description: Sales Order or Free Text, from the fact (EDW-59).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sales Order', 'Free Text']
      - name: is_intercompany_flag
        description: >
          From the fact (EDW-59). Carried, never excluded, so headline revenue reconciles to the AR
          ledger; a view of external revenue filters it.
      - name: payment_terms_code
        description: Invoice payment terms from the fact (PREPAID, NET10, NET30, NET45, NET60, UNKNOWN; NULL on free text). EDW-59.
      - name: payment_mode_code
        description: Tender of the originating order from the fact (CC-BT, Credit, RevPoints, Check, ACH; NULL when blank or free text). Attribute only. EDW-59.
      - name: is_dso_order_flag
        description: DSO program membership of the invoice account at the invoice date, from the fact. EDW-59.

      # Date attributes
      - name: invoice_date
        description: Invoice date.
      - name: fiscal_year
        description: Fiscal year from DIM_DATE (July 1 to June 30, named for the year it ends in).
      - name: fiscal_quarter
        description: Fiscal quarter number from DIM_DATE.
      - name: fiscal_month
        description: Fiscal month number from DIM_DATE (1 = July).
      - name: fiscal_year_week
        description: Week number within the fiscal year from DIM_DATE.
      - name: year_month_int
        description: Calendar year and month as yyyyMM from DIM_DATE.

      # Product attributes (latest version of the DIM_PRODUCT row)
      - name: product_id
        description: D365 item number.
      - name: style_number
        description: Style number.
      - name: style_name
        description: Style name. Unknown Product on the '-1' member.
      - name: summary_class
        description: Summary class.
      - name: product_group
        description: Product group.
      - name: reporting_category_group
        description: Reporting rollup, level 1 (REF_SUMMARY_CLASS_ROLLUP, EDW-125).
      - name: reporting_subcategory
        description: Reporting rollup, level 2 (REF_SUMMARY_CLASS_ROLLUP, EDW-125).
      - name: dw_sku_status
        description: Active or Retired, from DIM_PRODUCT.

      # Customer attributes (latest version of the DIM_CUSTOMER row)
      - name: customer_type
        description: Wholesale, Consumer or Unknown. Wholesale is a D365 account or a BigCommerce customer with a company name; Consumer is any other BigCommerce customer. Unknown is the reserved -1 member (EDW-135).
      - name: customer_status
        description: Prospect, Active, Inactive, Suspended or Unknown. Suspended is a blocked D365 account; otherwise D365 accounts are Prospect (never invoiced), Active (invoiced in the last 18 months) or Inactive. BigCommerce customers are Prospect. Unknown is the reserved -1 member (EDW-135).

      # Sales channel attributes
      - name: channel_code
        description: Sales channel code.
      - name: channel_name
        description: Sales channel name.
      - name: channel_type
        description: Sales channel type.
      - name: storefront_code
        description: Storefront code (US, CA) on the ecommerce channels.

      # Warehouse attributes
      - name: warehouse_id
        description: Warehouse id.

      # Volume
      - name: invoice_line_count
        description: Count of FACT_SALES_INVOICE rows. Additive.
      - name: invoice_count
        description: >
          Count of distinct invoice_id at the grain. Semi-additive: an invoice with more than one
          product, warehouse or invoice type is counted on each row it touches, so do not sum it
          across rows.
      - name: invoiced_qty
        description: Sum of invoiced_qty. Negative on credit lines, so returns net here.

      # Revenue (transaction currency)
      - name: gross_sales_amount
        description: Sum of gross_sales_amount (quantity x unit price).
      - name: line_discount_amount
        description: Sum of line_discount_amount.
      - name: header_discount_allocated
        description: Sum of header_discount_allocated. NULL until the fact carries the header discount (F1).
      - name: total_discount_amount
        description: Sum of total_discount_amount. Equal to line_discount_amount until the header discount lands.
      - name: net_sales_amount
        description: Sum of net_sales_amount. Net of credit lines.
        tests: [not_null]
      - name: tax_amount
        description: Sum of tax_amount.

      # Purchase price cost and margin (analysis basis, EDW-182)
      - name: cost_currency_code
        description: Currency of standard_cost_amount (USD).
      - name: standard_cost_amount
        description: >
          PURCHASE PRICE basis, not COGS (EDW-182): sum of standard_cost_amount, the line at
          FACT_PRODUCT_COST's current STANDARD cost (the D365 purchase trade agreement price,
          restated to the current price on every merge of the line), where the line has one. In
          cost_currency_code on every row, including CAD rows. Name kept so consumers do not break.
          The COGS basis is moving_avg_cost_amount.
      - name: net_sales_amount_with_cost
        description: >
          Sum of net_sales_amount on lines that have a purchase price in the transaction currency.
          The purchase price margin denominator. NULL on rows where the transaction currency is not
          the cost currency (CAD); the USD pair covers those.
      - name: gross_margin_std_amount
        description: >
          PURCHASE PRICE margin, an analysis number (EDW-182): net_sales_amount less
          standard_cost_amount on the lines counted in net_sales_amount_with_cost. Margin percent =
          gross_margin_std_amount / net_sales_amount_with_cost, divided by the consumer. NULL on
          CAD rows. Reads about 13 points above the finance basis (75 against 63 percent over
          Oct 2025 to Sep 2026); margin on a page reads gross_margin_moving_avg_amount.
      - name: net_sales_amount_usd_with_cost
        description: Sum of net_sales_amount_usd on lines that have a purchase price (USD on every line), CAD lines included. EDW-169.
      - name: gross_margin_std_amount_usd
        description: Purchase price margin in USD, net_sales_amount_usd less standard_cost_amount on the lines counted in net_sales_amount_usd_with_cost. EDW-169.

      # D365 posted cost and margin (EDW-182, decision record I6): the finance basis
      - name: moving_avg_cost_amount
        description: >
          COGS: sum of moving_avg_cost_amount, D365's posted cost on the invoice lines' InventTrans
          legs (I6), the number the ledger posted and the legacy f_InvoicesD365 COGS basis. USD on
          every row. Net of credit lines. NULL on free text rows.
      - name: net_sales_amount_with_moving_avg_cost
        description: >
          Sum of net_sales_amount on USD lines that have a posted cost. The denominator of the
          transaction-currency posted-cost margin. NULL on CAD rows (the posted cost is USD); the
          USD pair covers those.
      - name: gross_margin_moving_avg_amount
        description: >
          Gross margin at D365's posted cost, the finance basis: net_sales_amount less
          moving_avg_cost_amount on the lines counted in net_sales_amount_with_moving_avg_cost.
          Margin percent = gross_margin_moving_avg_amount / net_sales_amount_with_moving_avg_cost,
          divided by the consumer.
      - name: net_sales_amount_usd_with_moving_avg_cost
        description: Sum of net_sales_amount_usd on lines that have a posted cost, CAD lines included. The USD posted-cost margin denominator.
      - name: gross_margin_moving_avg_amount_usd
        description: >
          Gross margin at D365's posted cost in USD, summable across currencies: net_sales_amount_usd
          less moving_avg_cost_amount on the lines counted in net_sales_amount_usd_with_moving_avg_cost.
          The margin for the Orders and Sales Executive report.

      # Returns
      - name: return_qty
        description: Sum of the absolute invoiced_qty on return lines (is_return_flag, which includes negative-revenue free text credits from EDW-59). Positive.
      - name: return_amount
        description: >
          Sum of the absolute net_sales_amount on return lines (is_return_flag). Positive. Return
          rate = return_amount / (net_sales_amount + return_amount), divided by the consumer.

      # Below cost (EDW-146; stays on the purchase price basis under EDW-182)
      - name: below_cost_line_count
        description: >
          Count of lines where standard_cost_unit >= unit_price (priced under the purchase
          agreement price, the question EDW-146 asked), among lines with a purchase price in the
          transaction currency. Includes zero-price lines. NULL on CAD rows.
      - name: below_cost_net_sales_amount
        description: Sum of net_sales_amount on the below-cost lines. Below-Cost Net Sales.
      - name: below_cost_standard_cost_amount
        description: >
          Sum of standard_cost_amount on the below-cost lines. Below-Cost Gross Margin =
          below_cost_net_sales_amount less this; Gross Margin excl. Below-Cost =
          gross_margin_std_amount less Below-Cost Gross Margin.

      # Held for later builds (typed NULL)
      - name: landed_cost_amount
        description: Typed NULL until EDW-60.
      - name: gross_margin_landed_amount
        description: Typed NULL until EDW-60. Landed-cost margin, a different number from gross_margin_std_amount.
      - name: freight_cost_amount
        description: Typed NULL until EDW-60.
      - name: net_sales_amount_usd
        description: Sum of net_sales_amount_usd (the line as booked in USD). Summable across currencies. EDW-169.
      - name: loyalty_points_earned
        description: Typed NULL until the loyalty transaction fact exists (EDW-78).