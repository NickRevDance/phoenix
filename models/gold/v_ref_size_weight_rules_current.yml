version: 2

models:
  - name: v_ref_size_weight_rules_current
    description: >
      Active rows of ref_size_weight_rules (is_active = 1). One row per rule
      context + size. See README.md for the priority-matching ladder.
    columns:
      - name: size_weight_rule_key
        tests: [not_null, unique]
      - name: rule_id
        tests: [not_null]
      - name: priority
        tests: [not_null]
      - name: size
        tests: [not_null]
      - name: size_weight
        tests: [not_null]
      - name: effective_start_date
        tests: [not_null]
