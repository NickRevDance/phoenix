version: 2

models:
  - name: ref_sla_target
    description: >
      REF_SLA_TARGET -- governed, seed-managed reference of SLA and
      performance targets for department scorecards and alerting.
      shared_gold, presentation-facing (never joined to facts).
      Effective-dated, not SCD2-snapshotted, on the project ref-table
      convention: is_active (from the seed) marks the row in force and
      effective_to_date is 9999-12-31 while current. A target change sets
      the old row to is_active 0 with an end date and adds a new row; a
      mis-keyed row is corrected Type 1 in place. No current-row view by
      design: the table is imported disconnected into the semantic model,
      which filters is_active itself. See README.md for what's loaded vs. blocked on open spec
      decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - metric_code
            - business_unit_code
            - scope_type
            - scope_code
          config:
            where: "is_active = 1"
      - no_overlapping_effective_periods:
          partition_by:
            - metric_code
            - business_unit_code
            - scope_type
            - scope_code
    columns:
      - name: sla_target_key
        tests: [is_valid_key]
      - name: metric_code
        tests:
          - not_null
          - accepted_values:
              values: ['ABANDON_RATE', 'ASA', 'ATT', 'EMAIL_SLA_PCT', 'CALL_VOLUME', 'EMAIL_VOLUME']
      - name: metric_name
        tests: [not_null]
      - name: business_unit_code
        tests: [not_null]
      - name: scope_type
        tests:
          - not_null
          - accepted_values:
              values: ['GLOBAL', 'BRAND', 'QUEUE', 'CHANNEL', 'TEAM']
      - name: scope_code
        tests: [not_null]
      - name: comparison_operator
        tests:
          - not_null
          - accepted_values:
              values: ['<', '<=', '>=', '>']
      - name: target_value
        tests:
          - not_null:
              config:
                where: "is_monitor_only_flag = false"
      - name: target_unit
        tests:
          - not_null
          - accepted_values:
              values: ['SECONDS', 'RATE', 'COUNT']
      - name: goal_direction
        tests:
          - not_null
          - accepted_values:
              values: ['LOWER_IS_BETTER', 'HIGHER_IS_BETTER', 'MONITOR']
      - name: is_monitor_only_flag
        tests: [not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: effective_from_date
        tests: [not_null]
      - name: effective_to_date
        tests: [not_null]
