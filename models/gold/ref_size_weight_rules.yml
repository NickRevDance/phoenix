version: 2

models:
  - name: ref_size_weight_rules
    description: >
      REF_SIZE_WEIGHT_RULES (spec 8.1, EDW-47) -- size-level demand weight
      rules that drive inventory quality scoring, effective-dated straight
      from the business-maintained seed (no dbt snapshot). Follows the
      ref_sla_target pattern: size_weight_rule_key hashes rule_id +
      effective_start_date (version-distinct, not stable across versions);
      is_active (seed-maintained) is the current-row indicator -- no
      version_number, no row_hash, no separate current-row view; filter
      ref_size_weight_rules directly. See README.md for priority-matching
      logic and open items.
    columns:
      - name: size_weight_rule_key
        tests: [not_null, unique]
      - name: rule_id
        tests: [not_null]
      - name: priority
        tests:
          - not_null
          - accepted_values:
              values: [10, 20, 30, 40, 50, 60, 70, 80, 90]
      - name: size
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: size
              config:
                severity: warn  # spec 8.1: unmatched sizes are expected/reportable, not a hard failure -- feeds unmatched_size_count downstream (EDW-53)
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
