version: 2

models:
  - name: fact_inventory_movement
    description: >
      FACT_INVENTORY_MOVEMENT (Inventory Gold Layer spec, Section 3) -- one row per posted
      D365 inventory transaction leg, the certified record of business movement from
      2023-07-01 (D365 go-live). Incremental merge on inventory_movement_key. Excluded at
      source (spec 3.4): warehouse work (201, 203), the ITMGIT goods-in-transit layer (110),
      unposted legs (26, NULL, placeholder dates), transfer-order legs at a -T transit
      location, and the non-merchandise service items the snapshot fact also leaves out. The
      fact reconciles to InventTrans on net movement, not row for row. Product resolves
      through the D365 barcode path (variant to UPC to DIM_PRODUCT), the same path as
      FACT_INVENTORY_SNAPSHOT_DAILY; unresolved rows carry the unknown member (product_key '-1',
      EDW-151) and are reported, never dropped. Transfer and status-change legs carry their counterparty; those legs are
      re-read on every run so a pair completes even when its legs post days apart. Vendor
      receipts on a voyage are dated at the ship date and land in the -GT location first; the
      arrival at the warehouse is an ITMGIT leg and is not in this fact. The model header
      carries the full rules.
    tests:
      # EDW-93 item A: a paired leg never keeps a NULL counterparty
      - dbt_utils.expression_is_true:
          arguments:
            expression: "from_warehouse_key is not null and to_warehouse_key is not null"
          config:
            where: "movement_type in ('TRANSFER_IN', 'TRANSFER_OUT')"
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: "counterparty_inventory_status_code is not null"
          config:
            where: "movement_type = 'STATUS_CHANGE'"
            severity: warn
      # EDW-50: every status change carries both availability classes
      - dbt_utils.expression_is_true:
          arguments:
            expression: "from_availability_status is not null and to_availability_status is not null"
          config:
            where: "movement_type = 'STATUS_CHANGE'"
            severity: warn
    columns:
      - name: inventory_movement_key
        description: "Surrogate key: xxhash64 of the D365 InventTrans RECID. The incremental merge key."
        tests:
          - is_valid_key
      - name: movement_datetime
        description: "Physical movement date (D365 DATEPHYSICAL). Date grain in the source: midnight on every row."
        tests:
          - not_null
      # EDW-132 section 3: every date key relates to dim_date, at warn first (same as the sales facts on EDW-59).
      - name: movement_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: inventory_status_code
        description: >
          The leg's own D365 inventory status (InventDim.INVENTSTATUSID, blank read as UNKNOWN).
          STATUS_CHANGE follows the spec v2.2 rule, which replaced the v2.1 destination-status rule:
          a status change is two legs, an issue leg out of the from-status (negative quantity) and
          a receipt leg into the to-status (positive), so each leg carries its own status here and
          the other side's in counterparty_inventory_status_code. Both legs carry the same
          from/to_availability_status pair. The legs net to zero at product x warehouse x date and
          move quantity between statuses (assert_fact_inventory_movement_status_change_pairs).
        tests:
          - relationships:  # EDW-132 section 4: every status code is a current REF_INVENTORY_STATUS row
              arguments:
                to: ref('v_ref_inventory_status_current')
                field: inventory_status_code
              config:
                severity: warn
      - name: product_key
        description: >
          FK to DIM_PRODUCT (md5(UPC)), resolved through the D365 item barcode table: variant
          (item + size + colour) to UPC to the latest DIM_PRODUCT version. Never NULL: the unknown
          member, product_key '-1' (EDW-151), where the UPC is not in DIM_PRODUCT (EDW-134), the
          variant has no barcode row, or the item is the made-to-order studio apparel family
          (EDW-144). product_id is still populated on those rows.
        tests:
          - not_null
      - name: movement_type
        tests:
          - not_null
          - accepted_values:
              values: ['RECEIPT', 'SHIPMENT', 'RETURN', 'TRANSFER_OUT', 'TRANSFER_IN', 'STATUS_CHANGE', 'ADJUSTMENT', 'UNKNOWN']
      - name: receipt_document_id
        description: >
          D365 packing slip id. On vendor receipts about 4 percent carry one; the rest post
          through the landed-cost voyage process, which raises no product receipt. NULL, never
          an empty string, when the leg posted without one.
      - name: quantity_change
        tests:
          - not_null
      - name: unit_cost_at_movement
        description: >
          Posted physical cost per unit (COSTAMOUNTPHYSICAL / QTY). A zero is a posted zero
          (made-to-order and other zero-cost items), not a missing value.
      - name: is_quantity_anomaly_flag
        description: >
          True when the leg's quantity is at or over the anomaly threshold (var
          inventory_movement_anomaly_qty_threshold, default 1,000,000 units): D365 keying
          errors that were reversed the same day. Four rows today (about 821 billion units
          each, RC23947 on 2024-12-26 and RD70000 on 2025-06-13). The rows stay in the fact
          and net to one unit; a gross total by movement type should filter the flag.
        tests:
          # warn: the column is NULL on history until the fact is full-refreshed once
          - not_null:
              config:
                severity: warn
      - name: counterparty_inventory_status_code
        description: >
          STATUS_CHANGE legs only: the other side's status on the same voucher (the to-status
          on the issue leg, the from-status on the receipt leg). NULL on every other type.
        tests:
          - relationships:  # EDW-132 section 4: every status code is a current REF_INVENTORY_STATUS row
              arguments:
                to: ref('v_ref_inventory_status_current')
                field: inventory_status_code
              config:
                severity: warn
      - name: movement_reason_code
        description: >
          D365 ReferenceCategory code (InventTransType), on every row. Natural key into
          REF_MOVEMENT_REASON.
        tests:
          - relationships:  # EDW-50 (I1b): a code with no REF_MOVEMENT_REASON row is a DQ exception; the fact reads UNKNOWN meanwhile
              arguments:
                to: ref('v_ref_movement_reason_current')
                field: movement_reason_code
              config:
                severity: warn
      - name: movement_reason_desc
        description: >
          Friendly reason description from the current REF_MOVEMENT_REASON row at load. A code
          with no row reads the UNKNOWN row's description. EDW-50.
        tests:
          # warn: NULL on history until the fact is full-refreshed once
          - not_null:
              config:
                severity: warn
      - name: lot_id
        description: >
          D365 batch id (InventDim.InventBatchId), NULL when blank. Batch tracking is not
          switched on for any item, so this is NULL on every row today (Decision Record I1c).
      - name: retail_amount_change
        description: >
          quantity_change x the variant's current USD list price (v_product_price_current), priced
          at load: the same basis as the snapshot's retail_value_amount. NULL where the variant
          has no current USD list price or the product is the unknown member. A full refresh
          reprices history at the prices current then. EDW-50.
      - name: from_availability_status
        description: >
          STATUS_CHANGE legs only: availability_class of the from-status (current
          REF_INVENTORY_STATUS row). The same value on both legs of the pair. NULL on every
          other type. EDW-50.
      - name: to_availability_status
        description: >
          STATUS_CHANGE legs only: availability_class of the to-status, as above. EDW-50.
      - name: from_lifecycle_status
        description: >
          Reserved, NULL. No movement changes a product's lifecycle tier, so there is no
          before and after to record.
      - name: to_lifecycle_status
        description: Reserved, NULL, as from_lifecycle_status.
      - name: quantity_before
        description: Reserved, NULL (Decision Record I1a). The day-grain balance is on V_INVENTORY_MOVEMENT_RECONCILIATION.
      - name: quantity_after
        description: Reserved, NULL (Decision Record I1a), as quantity_before.
      - name: is_source_deleted_flag
        description: >
          True when D365 has deleted the InventTrans leg, including the original RECID when D365
          splits a leg into new ones. The leg stays on the fact; net movement reads such as
          V_INVENTORY_MOVEMENT_RECONCILIATION filter it, and pairing skips it. Kept in step with the
          silver delete mark by the model's post-hook. EDW-177.
        tests: [not_null]
