version: 2

models:
  - name: fact_product_cost
    description: >
      FACT_PRODUCT_COST -- insert-only accumulating fact, one row per
      product_id + cost_type + effective_date (spec grain). See project
      memory fact_product_cost_rebuild.md and
      fact_product_cost_spec_compliance_review.md for build history and
      known source gaps (no source for vendor trade agreements / PO
      actuals; no freight $/unit source).
    columns:
      - name: product_cost_key
        tests:
          - is_valid_key
      - name: product_key
        description: >
          Informational md5 of the item's representative UPC. -1 where the
          item has no DIM_PRODUCT row (EDW-134 coverage gap). Consumers
          join on product_id.
      - name: product_id
        tests:
          - not_null
      - name: cost_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['STANDARD', 'LANDED', 'VENDOR', 'PLM_ESTIMATED']
      - name: effective_date
        description: >
          Null where the D365 source's effective date was the 1900-01-01
          unset-date placeholder rather than a real date (EDW-94 A4).
      - name: effective_date_key
        description: >
          FK to DIM_DATE. -1 (DIM_DATE's reserved UNKNOWN member) where
          effective_date is null, instead of a literal 19000101 key
          outside DIM_DATE (EDW-94 A4).
      - name: vendor_key
        description: >
          FK to DIM_VENDOR. 0 (NO_VENDOR) on non-VENDOR cost_type rows,
          -1 (UNKNOWN) if a VENDOR row's vendor_id has no DIM_VENDOR match.
      - name: cost_subtype
        description: >
          PURCHASE_TRADE_AGREEMENT (STANDARD), VENDOR_TRADE_AGREEMENT
          (VENDOR), VOYAGE_ACTUAL (LANDED), PLM_ESTIMATE (PLM_ESTIMATED).
        tests:
          - accepted_values:
              arguments:
                values: ['PURCHASE_TRADE_AGREEMENT', 'VENDOR_TRADE_AGREEMENT', 'VOYAGE_ACTUAL', 'PLM_ESTIMATE']
      - name: standard_cost_unit
        description: >
          Purchase price per unit from the D365 purchase trade agreement.
          Where variants carry different open prices, the modal price
          across variants, ties to the lower (Decision Record v1.0, B).
      - name: landed_cost_unit
        description: >
          LANDED rows: goods_cost_unit plus the actual components, exactly
          (D365 voyage actuals). PLM_ESTIMATED rows: the Centric landed-cost
          estimate.
      - name: goods_cost_unit
        description: >
          PO line value per unit at the voyage (LINEAMOUNTMST / SHIPQTY,
          from the Duty row, any row otherwise). The goods base for landed
          cost. LANDED rows only.
      - name: freight_cost_unit
        description: >
          Ocean, Air and Land voyage cost per unit, quantity-weighted over
          the 365 days ending at the item's latest allocation. LANDED rows
          only; re-versions only when a new voyage lands.
      - name: duty_cost_unit
        description: >
          All-in customs charge per unit from D365 voyage cost type Duty.
          Includes tariffs; D365 does not split them. LANDED rows only.
      - name: tariff_cost_unit
        description: >
          NULL on LANDED rows; see duty_cost_unit. The estimated split is
          on the PLM_ESTIMATED row.
      - name: brokerage_cost_unit
        description: >
          Commission voyage cost per unit, same window as freight_cost_unit.
          Last allocation 2023, so NULL or zero on most items.
      - name: fx_rate_to_usd
        description: >
          USD spot rate for cost_currency_code as of the row's effective_date
          (D365's native ExchangeRate export, silver_d365_exchange_rate;
          EDW-94 Phase 2). 1.0 for USD rows (100% of rows today) without a
          lookup. Null where cost_currency_code has no D365 spot rate on
          file (anything but CAD/GBP as of this build) -- not guessed. No
          formal REF_FX_RATE / currency-normalization standard exists yet
          (EDW-127, unspecced) -- this is an interim direct read of D365's
          own rate, not a conformed FX dimension.
      - name: standard_cost_unit_usd
        description: >
          standard_cost_unit * fx_rate_to_usd. Null wherever either input is
          null (EDW-94 Phase 2).
      - name: landed_cost_unit_usd
        description: >
          landed_cost_unit * fx_rate_to_usd. Null wherever either input is
          null (EDW-94 Phase 2).
      - name: vendor_cost_unit_usd
        description: >
          vendor_cost_unit * fx_rate_to_usd. Null wherever either input is
          null (EDW-94 Phase 2).
      - name: plm_estimated_cost_unit_usd
        description: >
          plm_estimated_cost_unit * fx_rate_to_usd. Null wherever either
          input is null. Added 2026-09-18 to close the gap against EDW-94's
          acceptance criterion that USD-normalized fields exist for all 4
          cost_type values, not just STANDARD/LANDED/VENDOR.
