version: 2

models:
  - name: ref_inventory_quality_thresholds
    description: >
      REF_INVENTORY_QUALITY_THRESHOLDS (spec 8.2, EDW-48) -- externalized
      quality-scoring configuration, effective-dated straight from the
      business-maintained seed (no dbt snapshot). Follows the ref_sla_target
      pattern: threshold_key hashes setting_name + scope_product_subgroup +
      effective_start_date (version-distinct, not stable across versions);
      is_active (seed-maintained) is the current-row indicator -- no
      version_number, no row_hash, no separate current-row view; filter
      ref_inventory_quality_thresholds directly. See README.md for the
      sub-group-then-ALL consumption pattern.
    columns:
      - name: threshold_key
        tests: [not_null, unique]
      - name: setting_name
        tests: [not_null]
      - name: setting_type
        tests:
          - accepted_values:
              values: ['number', 'percentage', 'text']
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
