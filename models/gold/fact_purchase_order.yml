version: 2

models:
  - name: fact_purchase_order
    description: >
      FACT_PURCHASE_ORDER v1.0. One row per purchase order line version (dbt snapshot over
      silver_stage_fact_purchase_order). Covers both order classes (VENDOR and the O/UPO-
      ADJUSTMENT series) and every line status. Receipts, invoices and in-transit rows join
      on d365_invent_trans_id; VENDOR received_qty comes from the in-transit module, since
      Revolution's vendor invoices post at shipment.
    tests:
      # Spec 8.9: one current row per line, no overlapping version ranges, version 1 is current
      - one_current_row_per_key:
          name: fact_purchase_order_one_current_row_per_key
          arguments:
            key_columns: ['purchase_order_entity_key']
      - no_overlapping_effective_periods:
          name: fact_purchase_order_no_overlapping_effective_periods
          arguments:
            partition_by: ['purchase_order_entity_key']
            from_column: effective_start_datetime
            to_column: effective_end_datetime
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['purchase_order_entity_key', 'version_number']
    columns:
      - name: purchase_order_key
        tests: [is_valid_key]
      - name: purchase_order_entity_key
        tests: [not_null]
      - name: purchase_order_id
        tests: [not_null]
      - name: purchase_order_line_number
        tests: [not_null]
      - name: d365_invent_trans_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: is_current_row
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: purchase_order_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VENDOR', 'ADJUSTMENT']
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: expected_receipt_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: vendor_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: warehouse_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_key
      - name: po_line_status
        tests:
          - accepted_values:
              arguments:
                values: ['None', 'Backorder', 'Received', 'Invoiced', 'Canceled']
      - name: receipt_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Not Received', 'Partially Received', 'Fully Received', 'Cancelled']
      - name: ordered_qty
        tests: [not_null]
      - name: received_qty
        tests: [not_null]
      - name: in_transit_qty
        tests: [not_null]
      - name: invoiced_qty
        tests: [not_null]
      - name: cancelled_qty
        tests: [not_null]
      - name: open_qty
        tests: [not_null]

  - name: v_fact_purchase_order_current
    description: >
      Current version of each purchase order line (is_current_row = 1), with the version
      control columns removed except purchase_order_entity_key and purchase_order_key.
      Adds is_late_flag and days_late_to_date against today. Includes both order classes
      and the quantity outlier; certified use filters purchase_order_class = 'VENDOR' and
      is_quantity_outlier_flag = 0.
    columns:
      - name: purchase_order_key
        tests: [is_valid_key]
      - name: purchase_order_entity_key
        tests: [unique, not_null]
