version: 2

models:
  - name: fact_purchase_order
    description: >
      FACT_PURCHASE_ORDER -- PO line version/change-event history fact
      (D365 PurchTable + PurchLine + VendPackingSlipTrans + VendInvoiceTrans),
      real SCD2 via dbt snapshot. See README.md for build status, known
      gaps, and open decisions.
    columns:
      - name: purchase_order_key
        tests: [is_valid_key]
      - name: purchase_order_id
        tests: [not_null]
      - name: purchase_order_line_number
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: vendor_key
        tests:
          - relationships:
              to: ref('dim_vendor')
              field: vendor_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: warehouse_key
        tests:
          - relationships:
              to: ref('dim_warehouse')
              field: warehouse_key
      - name: receipt_status
        tests:
          - accepted_values:
              values: ['Not Received', 'Partially Received', 'Fully Received']
              config:
                where: "receipt_status is not null"

  - name: v_fact_purchase_order_current
    description: >
      Current-row view over fact_purchase_order (is_current_row = true)
      with SCD2 and internal metadata columns stripped -- the object most
      consumers should query instead of the full version history.
    columns:
      - name: purchase_order_key
        tests:
          - is_valid_key

