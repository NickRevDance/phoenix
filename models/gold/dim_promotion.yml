version: 2

models:
  - name: dim_promotion
    description: >
      DIM_PROMOTION -- conformed promotion master (SCD Type 2), shared_gold.
      One governed row per source promotion per storefront per SCD2 version:
      D365 trade agreements (promotion_class = CONTRACTUAL_PRICING) and
      manual seed rows this pass; BigCommerce promotions/coupons pending
      EDW-33 (see README.md). Precedes FACT_DISCOUNT_APPLICATION by design --
      promotion_key there is Phase 1 NOT NULL, so this dimension and its
      default members (0 = NO_PROMOTION, -1 = UNKNOWN) must exist first.
      Coupon codes are NOT dimension rows -- the degenerate coupon_code
      stays on the fact.
    tests:
      - dbt_utils.unique_combination_of_columns:  # EDW-7: exactly one current row per natural key
          arguments:
            combination_of_columns:
              - source_system
              - source_storefront_code
              - source_promotion_id
          config:
            where: "is_current_row = 1"
    columns:
      - name: promotion_key
        tests:
          - is_valid_key
      - name: source_promotion_id
        tests:
          - not_null
      - name: promotion_class
        tests:
          - accepted_values:
              arguments:
                values: ['MARKETING_PROMOTION', 'CONTRACTUAL_PRICING', 'MARKDOWN', 'INTERNAL', 'SYSTEM']
      - name: promotion_mechanism
        tests:
          - accepted_values:
              arguments:
                values: ['PERCENT_OFF', 'AMOUNT_OFF', 'BOGO', 'TIERED_VOLUME', 'BUNDLE', 'FREE_SHIPPING', 'PRICE_OVERRIDE', 'GIFT_WITH_PURCHASE']
              config:
                where: "promotion_class <> 'SYSTEM'"  # reserved members 0 / -1 carry NONE / UNKNOWN; the spec domain has no neutral value
      - name: discount_type_default
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LINE_DISCOUNT', 'HEADER_DISCOUNT', 'COUPON', 'VOLUME_BREAK', 'TRADE_AGREEMENT', 'MANUAL_OVERRIDE', 'EMPLOYEE', 'BUNDLE', 'FREE_SHIPPING']
          - relationships:  # same governed domain as FACT_DISCOUNT_APPLICATION.discount_type, one definition
              arguments:
                to: ref('ref_discount_type_classification')
                field: discount_type
      - name: discount_value
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "discount_value between 0 and 1"
              config:
                where: "discount_value_unit = 'PERCENT'"
      - name: discount_value_unit
        tests:
          - accepted_values:
              arguments:
                values: ['PERCENT', 'AMOUNT']
