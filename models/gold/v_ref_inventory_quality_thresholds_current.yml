version: 2

models:
  - name: v_ref_inventory_quality_thresholds_current
    description: >
      Active rows of ref_inventory_quality_thresholds (is_active = 1). One row
      per setting_name + scope_product_subgroup. Consumers read the product's
      sub-group row and fall back to the ALL row. See README.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - setting_name
            - scope_product_subgroup
    columns:
      - name: threshold_key
        tests: [not_null, unique]
      - name: setting_name
        tests: [not_null]
      - name: scope_product_subgroup
        tests: [not_null]
      - name: setting_value
        tests: [not_null]
      - name: setting_type
        tests: [not_null]
