version: 2

models:
  - name: fact_orders_returns
    description: >
      FACT_ORDERS_RETURNS -- Type 1 overwrite, current-state order + return
      lifecycle fact (D365 SalesLine + SalesTable + McrReturnSalesTable).
      Combines forward-demand and return order lines in one physical table
      per spec Section 4.9. See README.md for build status and open
      decisions. EDW-57 fills shipped_qty, actual_ship_date and the
      fulfillment fields on the invoice basis, open_qty from D365's remaining
      quantity, and the open order value.
    tests:
      - dbt_utils.unique_combination_of_columns:  # 2026-09-21 (EDW-22 review, spec Section 3): grain is d365_sales_line_rec_id, not order_id + order_line_number -- same rec_id-grain fix as FACT_SALES_INVOICE's EDW-23 round.
          arguments:
            combination_of_columns:
              - order_id
              - d365_sales_line_rec_id
      - dbt_utils.expression_is_true:  # EDW-58 (spec 7.10): an exchange always reads Exchange as its refund method.
          arguments:
            expression: "refund_method = 'Exchange'"
          config:
            where: "is_exchange_flag"
      - dbt_utils.expression_is_true:  # EDW-169: USD lines carry a rate of 1
          arguments:
            expression: "fx_rate_to_usd = 1"
          config:
            where: "transaction_currency_code = 'USD'"
      - dbt_utils.expression_is_true:  # EDW-169: wholesale is net less Nimbly fee and commission
          arguments:
            expression: "wholesale_line_amount = net_line_amount - nimbly_fee_amount - nimbly_commission_amount"
      - dbt_utils.expression_is_true:  # EDW-169: the same in USD; each term is rounded to 6 places on its own
          arguments:
            expression: "abs(wholesale_line_amount_usd - (net_line_amount_usd - nimbly_fee_amount_usd - nimbly_commission_amount_usd)) <= 0.00001"
      - dbt_utils.expression_is_true:  # EDW-57 (spec 7.4): open quantity is never negative
          arguments:
            expression: "open_qty >= 0"
          config:
            where: "not is_return_flag"
      - dbt_utils.expression_is_true:  # EDW-57: on an open line D365's remaining quantity equals ordered less shipped less cancelled; warn, since it depends on what D365 holds
          arguments:
            expression: "open_qty = ordered_qty - shipped_qty - cancelled_qty"
          config:
            where: "order_line_status = 'Confirmed'"
            severity: warn
    columns:
      - name: orders_returns_key
        tests: [is_valid_key]
      - name: order_id
        tests: [not_null]
      - name: order_line_number
        tests: [not_null]
      - name: d365_sales_line_rec_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: order_type
        tests:
          - accepted_values:
              arguments:
                values: ['Sales Order', 'Return Order', 'Unknown']
      - name: rma_id
        description: D365 RMA number (SalesTable.RETURNITEMNUM, RMA-nnnnnn) on return rows and on the sales rows of a replacement order, NULL otherwise. Joins a return to the order that replaced it. EDW-58.
      - name: original_d365_sales_line_rec_id
        description: d365_sales_line_rec_id of the original sales line behind a return line (SalesLine.INVENTTRANSIDRETURN). NULL on cancelled returns, some awaited returns and sales rows. EDW-58.
      - name: replacement_order_id
        description: order_id of the sales order that replaces an exchange return. NULL when the return is not an exchange and on sales rows. EDW-58.
      - name: return_status
        description: SalesLine.RETURNSTATUS on return rows (spec 7.9). NULL on sales rows. EDW-58.
        tests:
          - accepted_values:
              arguments:
                values: ['Awaiting', 'Registered', 'Received', 'Invoiced', 'Cancelled']
              config:
                severity: warn  # a status D365 has not used before is kept as its number and shows here, without failing the daily job
      - name: is_exchange_flag
        description: Return rows, true when the return order has a replacement order (spec 4.11). NULL on sales rows. EDW-58.
      - name: is_replacement_flag
        description: Sales rows, true when the order is named as the replacement on a return order (spec 4.11). NULL on return rows. EDW-58.
      - name: return_reason_category
        description: Fit, Preference, Quality, Fulfillment, Customer or Other from ref_return_reason_category (spec 7.8). Every return row has one; NULL on sales rows. EDW-58.
        tests:
          - accepted_values:
              arguments:
                values: ['Fit', 'Preference', 'Quality', 'Fulfillment', 'Customer', 'Other']
          - not_null:
              config:
                where: "is_return_flag"
      - name: return_disposition
        description: Label for return_disposition_code (spec 4.6). NULL when the code is blank and on sales rows. EDW-58.
        tests:
          - accepted_values:
              arguments:
                values: ['CREDIT', 'REPLACE_SCRAP', 'CREDIT_INSPECT', 'UNKNOWN']
      - name: refund_method
        description: The return order's payment mode decoded, Exchange taking precedence (spec 4.11). NULL on sales rows. EDW-58.
        tests:
          - accepted_values:
              arguments:
                values: ['Original Payment', 'Store Credit', 'Loyalty Points', 'Exchange', 'Unknown']
      - name: customer_key
        tests:
          - not_null  # EDW-135: never NULL -- headerless lines resolve to the dim_customer -1 member
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: customer_segment_key
        description: >
          DIM_CUSTOMER_SEGMENT key of the order account when the line was written, held on later
          merges while the customer is unchanged. History before EDW-59 reads the segment on the day
          of the refresh, and a full refresh restates it. NULL on the -1 customer. EDW-59.
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer_segment')
                field: customer_segment_key
              config:
                severity: warn  # same as the dim_customer test (EDW-132), error at a later pass
      - name: is_dso_order_flag
        description: >
          DIM_CUSTOMER is_dso_member_flag on the customer version in effect at the order date.
          Membership history starts with the first customer snapshot (Oct 14 2026); earlier orders
          read that first version. NULL on the -1 customer. EDW-59.
        tests:
          - not_null:
              config:
                where: "customer_key <> -1"
                severity: warn
      # EDW-132 section 3 (folded into EDW-59): every date key relates to dim_date, at warn first.
      # A placeholder date that slips past the 1901 / 2040 bounds would orphan here. 0 orphans on Oct 15 2026.
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: requested_ship_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: confirmed_ship_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: actual_ship_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: estimated_ship_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: delivery_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: return_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: return_request_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: cancel_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: order_date
        description: Central calendar day (America/Chicago) of SalesTable.CREATEDDATE, which D365 stores in UTC. NULL on placeholder dates. EDW-184 (was the UTC day, which put orders created after 7 PM Central, 6 PM in winter, on the next day).
      - name: return_request_date
        description: The return order's CREATEDDATE on return rows, Central calendar day as order_date. NULL on sales rows. EDW-58, EDW-184.
      - name: unresolved_upc
        description: D365 barcode (UPC) that had no DIM_PRODUCT row, so product_key is -1. NULL when product_key resolved or no barcode exists. EDW-134.
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                severity: error  # EDW-134 (2026-10-05): every product_key now exists in dim_product ('-1' is a real member); was warn. Prior note: -1 unresolved-to-barcode rows are
                # expected by design (same convention as fact_order_line/
                # fact_sales_invoice), which would always fail a hard
                # relationships test.
      - name: sales_channel_key
        tests: [not_null]  # never NULL -- coalesced to -1 above
      - name: ordered_qty
        tests: [not_null]
      - name: fx_rate_to_usd
        description: Spot rate to USD at the order date from the D365 monthly spot table (EDW-94 interim), nearest rate where a date falls outside the published ranges; 1 on USD. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn  # coverage: a currency with no spot rate surfaces here without stopping the run
      - name: net_line_amount_usd
        description: net_line_amount x fx_rate_to_usd. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn
      - name: nimbly_fee_amount
        description: Nimbly website fee, SalesLine.REVWEBSITEFEE per unit x ordered_qty. Transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_commission_amount
        description: Nimbly commission, SalesLine.REVCOMMISSION per unit x ordered_qty. Transaction currency. EDW-169.
        tests: [not_null]
      - name: wholesale_line_amount
        description: net_line_amount less Nimbly fee and commission, transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_fee_amount_usd
        description: nimbly_fee_amount x fx_rate_to_usd. EDW-169.
      - name: nimbly_commission_amount_usd
        description: nimbly_commission_amount x fx_rate_to_usd. EDW-169.
      - name: custom_print_fee_amount
        description: Custom print fee, SalesLine.REVNETCUSTOMPRINTFEE, a line amount as stored. Informational, not taken off wholesale. EDW-169.
        tests: [not_null]
      - name: custom_print_fee_amount_usd
        description: custom_print_fee_amount x fx_rate_to_usd. EDW-169.
      - name: wholesale_line_amount_usd
        description: net_line_amount_usd less the USD fee and commission; the basis of Order Amount. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn
      - name: shipped_qty
        description: Invoiced quantity on the line, the sum of CustInvoiceTrans.QTY on INVENTTRANSID (invoice basis, spec 4.9). 0 when nothing is invoiced; NULL on return rows. EDW-57.
        tests:
          - not_null:
              config:
                where: "not is_return_flag"
      - name: open_qty
        description: D365's remaining quantity to deliver (SalesLine.REMAINSALESPHYSICAL). Above 0 only on open (Confirmed) lines; NULL on return rows. The Executive Summary's Open Orders Units. EDW-57.
        tests:
          - not_null:
              config:
                where: "not is_return_flag"
      - name: actual_ship_date
        description: Earliest invoice date on the line (invoice basis, spec 4.9). NULL unshipped and on return rows. EDW-57.
      - name: estimated_ship_date
        description: SalesLine.REVESTIMATEDSHIPDATE, the current estimated ship date. NULL when D365 holds a placeholder; see estimated_ship_date_status. Sales rows only. EDW-57.
      - name: original_estimated_ship_date
        description: SalesLine.REVOGESTIMATEDSHIPDATE, the first ship date promised; the on-time target. Sales rows only. EDW-57.
      - name: estimated_ship_date_status
        description: Assigned, Not Assigned (D365 placeholder 1900-01-01) or Awaiting Release (2040-01-01, branded lines held for release). NULL on return rows. EDW-57.
        tests:
          - accepted_values:
              arguments:
                values: ['Assigned', 'Not Assigned', 'Awaiting Release']
      - name: carrier_code
        description: Conformed carrier from the SalesLine.DLVMODE token before the first hyphen (spec 7.11). NULL when DLVMODE is blank. EDW-57.
        tests:
          - accepted_values:
              arguments:
                values: ['UPS', 'FEDEX', 'USPS', 'FRONTIER', 'IDS', 'SHIP_TO_DESK', 'UNKNOWN']
      - name: shipping_method
        description: SalesLine.DLVMODE as sourced (EDW-57; read the order header before, which is blank on most orders).
      - name: payment_terms_code
        description: SalesTable.PAYMENT conformed (spec 7.12). EDW-57.
        tests:
          - accepted_values:
              arguments:
                values: ['PREPAID', 'NET10', 'NET30', 'NET45', 'NET60', 'UNKNOWN']
      - name: payment_mode_code
        description: SalesTable.PAYMMODE as sourced, blank to NULL (spec 4.13). EDW-57.
      - name: open_line_amount
        description: net_line_amount x open_qty / ordered_qty. Transaction currency. NULL on return rows. EDW-57.
      - name: open_line_amount_usd
        description: open_line_amount x fx_rate_to_usd. EDW-57.
      - name: open_wholesale_amount
        description: wholesale_line_amount x open_qty / ordered_qty. Transaction currency. NULL on return rows. EDW-57.
      - name: open_wholesale_amount_usd
        description: open_wholesale_amount x fx_rate_to_usd; the Executive Summary's Open Orders Amount. EDW-57.
        tests:
          - not_null:
              config:
                where: "not is_return_flag"
                severity: warn  # coverage: a currency with no spot rate surfaces here without stopping the run
      - name: inventory_status_code
        description: >
          D365 inventory status on the line's inventory dimension (InventDim.INVENTSTATUSID through
          SalesLine.INVENTDIMID), blank read as UNKNOWN. On a sales line, the inventory the line was
          ordered from: Available (regular stock) or a program status such as Tippi Toes; it matches the
          status issued at shipment. On a return line, the status the return is received into. SUP-11.
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:  # every status code is a current REF_INVENTORY_STATUS row, as on the inventory facts
              arguments:
                to: ref('v_ref_inventory_status_current')
                field: inventory_status_code
              config:
                severity: warn

  - name: v_metrics_order_fulfillment
    description: >
      Certified order fulfillment/return metrics view per spec Section 9.
      EDW-58 adds the return lifecycle columns, exchange_rate and
      return_processing_days. EDW-57 fills fill_rate, order_to_ship_days,
      on_time_ship_flag / on_time_ship_pct and return_rate on the invoice
      basis (fulfillment_basis), and adds the open order columns with the
      Executive Summary's Open Order Status labels, evaluated at query time.

# EDW-58: the return link checks that need a self-join (original line,
# replacement order, RMA number on both sides of an exchange) are in
# tests/assert_fact_orders_returns_return_links.sql.
#
# Deferred, not implemented in this pass:
#   - relationship_coverage-style check on sales_channel_key: same known
#     BigComUSA reseed gap already flagged on FACT_ORDER_LINE/
#     FACT_SALES_INVOICE/ref_sales_origin_map -- coalesced to -1 here so
#     nothing breaks, not re-flagged as a new test.
#   - net_line_amount = LINEAMOUNT reconciliation test: now trivially true
#     by construction (net_line_amount is sourced directly from LINEAMOUNT),
#     not worth a dedicated test.