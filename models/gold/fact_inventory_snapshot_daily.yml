version: 2

# EDW-117 item 9 (Inventory Gold Layer spec v2.6): description blocks for the snapshot fact
# and its four certified companion views, the spec-grain test, and the branch / seam rules.
# EDW-49: retail_value_amount / last_sale_date wiring and derivation tests.
# EDW-180: cost column descriptions by branch and date after the 2026-10-22 history fill.

models:
  - name: fact_inventory_snapshot_daily
    description: >
      Daily point-in-time inventory position, one row per snapshot_date_key + product_key +
      warehouse_key + inventory_status_code (spec v2.1 grain). Two source branches with
      DIFFERENT POPULATIONS, told apart by record_source_table (a branch constant, spec 2.5):
      backfill rows from the legacy f_KPI_InventoryValue report (2024-06-30 to 2026-08-31;
      weekly cadence through 2025, daily from 2026; the legacy KPI population, status detail
      only from mid-2026; legacy historical unit cost) and native rows from D365 InventSum +
      InventDim (2026-09-01 forward; all statuses, all warehouses, daily; FACT_PRODUCT_COST
      current STANDARD cost on product_id). A trend across the seam steps as an artefact of
      population. Native rows are positions: a row exists only while some quantity measure
      (on hand, reserved, available, on order, in transit) is non-zero (spec 2.1 v2.6).
      Product resolution is the D365 barcode path (variant to UPC to DIM_PRODUCT); unresolved
      rows keep their UPC, carry the unknown member (product_key '-1', EDW-151), and are
      reported, never dropped.
      Supply columns are item + warehouse grain on the rank-1 status row (spec 2.6).
      NEVER --full-refresh in prod: the native branch can only produce today, so a full refresh
      destroys accumulated native history. Corrections are applied in place. Known history
      gaps and corrections are listed in spec Section 2.7.
    tests:
      # Spec grain (v2.4, 2.3), checked on resolved products. Rows at the unknown member ('-1',
      # EDW-151) are many variants on one key by design and are told apart by UPC, so they are
      # left out. Warn until EDW-134 brings that population down, then error. The surrogate-key
      # unique test is not a substitute.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date_key
              - product_key
              - warehouse_key
              - inventory_status_code
          config:
            severity: warn
            where: "product_key <> '-1'"
      # EDW-49: a sale can't postdate the snapshot it is reported on
      - dbt_utils.expression_is_true:
          arguments:
            expression: "last_sale_date <= snapshot_date"
          config:
            where: "last_sale_date is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "retail_value_amount >= 0"
          config:
            where: "retail_value_amount is not null and on_hand_qty >= 0"
    columns:
      - name: inventory_snapshot_key
        description: >
          Surrogate grain key: xxhash64(snapshot_date, item id, size, colour, warehouse location,
          site, inventory_status_code) on the native branch (site added under EDW-117 item 4, new
          days only; history is never re-keyed), xxhash64(snapshot date, UPC, warehouse,
          status) on the backfill branch. The incremental merge key.
        tests:
          - unique
          - not_null
      # EDW-132 section 3: every date key relates to dim_date, at warn first (same as the sales facts on EDW-59).
      - name: snapshot_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: inventory_status_code
        tests:
          - relationships:  # EDW-132 section 4: every status code is a current REF_INVENTORY_STATUS row
              arguments:
                to: ref('v_ref_inventory_status_current')
                field: inventory_status_code
              config:
                severity: warn
      - name: product_key
        description: >
          FK to DIM_PRODUCT (md5(UPC)), resolved through the D365 item barcode table: variant
          (item + size + colour) to UPC to the current DIM_PRODUCT row. Never NULL: where the UPC
          is absent from DIM_PRODUCT (EDW-134) or the variant has no barcode row, the row is kept
          at the unknown member, product_key '-1' (EDW-151), and the UPC and product_id are still
          populated so the miss is diagnosable. Non-merchandise service items (fees, catalogs,
          requests) are filtered at the native branch and never appear.
        tests:
          - not_null
      - name: upc
        description: >
          UPC from the barcode path (native) or the legacy report (backfill). Populated even when
          product_key is the unknown member ('-1') because DIM_PRODUCT lacks the UPC.
      - name: record_source_table
        description: >
          Branch constant, not the physical staging name (spec 2.2 / 2.5): one value for the native
          branch, one for the backfill branch, both minted by the inventory_snapshot_branch_label()
          macro. Views filter on the macro, never on the string.
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'silver_d365_inventory_sum + silver_d365_inventory_dim'
                  - 'silver_kpi_inventory_value'
      - name: lifecycle_status_code
        description: >
          Derived from the DIM_PRODUCT current row at load, first match wins: CLEARANCE (erp_status
          Sell_to_0, or plm_status Dropped with on-hand remaining), NEW (debut_date within the
          trailing 12 months), else CORE. VINTAGE retired at v2.6: the product master's Vintage
          flag is a carryover flag, not an aged tier (EDW-117 item 10). NULL when the product
          join misses.
        tests:
          - accepted_values:
              arguments:
                values: ['CLEARANCE', 'NEW', 'CORE']
      - name: on_order_qty
        description: >
          Open PO remaining-to-receive quantity from native PurchLine (PURCHSTATUS = 1), item +
          warehouse grain attributed to the rank-1 status row (supply-rank guard); zero on every
          other status row and on rows with no open PO, so a zero is a real zero. Live from
          2026-09-11; NULL on backfill rows and native rows before that date (live-state source,
          not backfillable). Supply-only positions (zero on hand, open PO) are kept as rows.
        tests:
          - not_null:
              config:
                where: "record_source_table = 'silver_d365_inventory_sum + silver_d365_inventory_dim' and snapshot_date >= '2026-09-11'"
      - name: in_transit_inbound_qty
        description: >
          Vendor-PO goods in transit from native ItmGoodsInTransitOrder (STATUS = 1), same grain,
          attribution, go-live and NULL rules as on_order_qty. Ties to InventSum on hand at the
          -GT locations to the unit (verified 2026-09-21).
        tests:
          - not_null:
              config:
                where: "record_source_table = 'silver_d365_inventory_sum + silver_d365_inventory_dim' and snapshot_date >= '2026-09-11'"
      - name: in_transit_transfer_qty
        description: >
          Inter-warehouse transfer quantity on the destination leg from native InventTransferLine;
          source has no live rows yet, reads 0. Same grain, attribution and NULL rules as
          on_order_qty.
        tests:
          - not_null:
              config:
                where: "record_source_table = 'silver_d365_inventory_sum + silver_d365_inventory_dim' and snapshot_date >= '2026-09-11'"
      - name: reorder_point_qty
        description: >
          Phase 2, reserved. Not maintained in D365 and not in the reflection feed (decision I2c).
          Stays NULL by decision; reorder_flag is out of scope.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
      - name: safety_stock_qty
        description: >
          Phase 2 (EDW-126). D365 item coverage safety stock as delivered by the reflection feed
          (d365_reflection.inventory_onhand.SafetyStock, decision I2a), joined on upc + warehouse_id
          + inventory_site_id. Item + warehouse grain, carried on the rank-1 status row only (spec
          2.6). NULL where no coverage is maintained (I2b), never 0 and never a seeded default.
          Native rows only, from the first run carrying it; never backfilled (I2d), so earlier
          native days stay NULL. Coverage is Niles Costume today (5,701 barcodes on 2026-10-19),
          so a NULL is a valid value and the column has no not_null test. Tie test:
          assert_snapshot_safety_stock_reconciles_to_feed.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "safety_stock_qty is not null"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "record_source_table = 'silver_kpi_inventory_value'"
      - name: standard_cost_unit
        description: >
          Not the inventory valuation basis (EDW-180; the valuation basis is moving_avg_cost_unit).
          Native rows: purchase price, FACT_PRODUCT_COST current STANDARD cost (the D365 purchase
          trade agreement price) joined on product_id (item grain, EDW-94 A1); D365 moving average
          ran about 45 percent above it on 2026-10-16. Backfill rows: the legacy report's UnitCost,
          which is not value / quantity (on_hand_qty x UnitCost is about half the value, e.g.
          $12.2M against $26.1M on 2026-06-30) and should not be used as a unit cost. Name kept so
          consumers do not break.
      - name: standard_cost_amount
        description: >
          Native rows: on_hand_qty x standard_cost_unit, inventory at purchase price, an analysis
          value. Backfill rows: the legacy feed's InventoryAmount, which is D365's own Inventory
          value report output (within $235 on all 2,137 date and warehouse pairs to 2026-08-31), so
          on those rows it is D365's valuation and does NOT equal on_hand_qty x standard_cost_unit.
          The inventory value on every branch is moving_avg_cost_amount (EDW-180).
      - name: moving_avg_cost_unit
        description: >
          EDW-180: D365 moving average cost per unit, the basis Revolution carries inventory at.
          Source by branch and date:
          (1) Native rows from 2026-10-17, nightly: D365 value / D365 quantity at item + site +
          warehouse + colour + size from InventTrans (financially updated legs at posted cost plus
          adjustments, physical-only legs at physical cost), applied to every status row at that
          grain.
          (2) Native rows 2026-09-01 to 2026-10-16: filled in place on 2026-10-22 (D012, backup
          clone first) from D365's Inventory value report (silver_kpi_inventory_value) for the same
          snapshot date, value / quantity at UPC + warehouse, or the next day's report run where the
          same day has no positive value (1,314 rows on 24 dates).
          2026-09-04 to 2026-09-09 have no rows (spec 2.7).
          (3) Backfill rows 2024-06-30 to 2026-08-31: filled in place on 2026-10-22 as
          standard_cost_amount / on_hand_qty at snapshot date + UPC + warehouse, i.e. D365's own
          Inventory value report; on every date the filled groups tie to D365's value within cents.
          NULL on every branch where D365 holds no positive value or quantity at the grain (e.g.
          16,696 stocked units in v_current_inventory scope on 2026-10-22, mostly variants with no
          barcode); do not fall back to purchase price. Not an InventTrans as-of rebuild for
          history, and never the legacy UnitCost.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn
                where: "moving_avg_cost_unit is not null"
      - name: moving_avg_cost_amount
        description: >
          EDW-180: inventory value, on_hand_qty x moving average cost, on every branch, computed from
          the unit cost before it is rounded to the 4 decimals stored in moving_avg_cost_unit, so
          on_hand_qty x moving_avg_cost_unit can differ from it by cents on a row. NULL when moving_avg_cost_unit is NULL.
          In-scope totals (company-owned statuses, stocked items): 2026-06-30 fiscal close
          (2026-07-01 row) $26.08M, Niles $24.80M and Niles-GT $1.28M; 2026-10-16 $27.99M, Niles
          $24.97M and Niles-GT $3.02M. Month-end close rows: the month-end row through Jan 2026,
          the 1st of the next month from Feb 2026 (EDW-183). Nightly rows differ from D365's own
          value only by physical vs financial timing (registered and picked quantities count in
          on-hand, not in value). Tie test on the latest day:
          assert_inventory_moving_avg_value_ties_to_d365.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                severity: warn
                where: "moving_avg_cost_unit is null"
      - name: landed_cost_unit
        description: >
          From FACT_PRODUCT_COST (cost_type LANDED, current row) on product_id; native rows only.
          Coverage 70.7 percent of rows / 71.4 percent of units on 2026-09-21 (EDW-49).
      - name: landed_cost_amount
        description: "on_hand_qty x landed_cost_unit; NULL when landed_cost_unit is NULL."
      - name: cost_variance_amount
        description: >
          landed_cost_amount - standard_cost_amount (spec 2.3 derived rule). NULL when either
          amount is NULL. Derivation test below (EDW-49).
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= landed_cost_amount - standard_cost_amount"
              config:
                where: "cost_variance_amount is not null"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "landed_cost_amount is not null and standard_cost_amount is not null"
      - name: retail_value_amount
        description: >
          Phase 2, EDW-49 item 1: on_hand_qty x list_price_usd from v_product_price_current joined
          on product_key (one row per variant, USD pivoted), priced at load. Native rows only; NULL
          where the variant has no current USD list price. Live in prod from snapshot 2026-09-23;
          native rows 2026-09-01 to 2026-09-22 stay NULL (the merge only writes today). Prod
          coverage on 2026-09-23/24: 95.4 percent of on-hand rows, 84.5 percent of on-hand units,
          about $79M at list. Derivation test: assert_snapshot_retail_value_derivation.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "record_source_table = 'silver_kpi_inventory_value'"
      - name: last_sale_date
        description: >
          Phase 2, EDW-49 item 2: MAX(invoice_date) from FACT_SALES_INVOICE per product_key +
          warehouse_key, excluding returns (is_return_flag). Current-state aggregate, native rows
          only. NULL where the product has never sold from that warehouse (about 28 percent of
          native rows in prod on 2026-09-23/24). Live in prod from snapshot 2026-09-23; native rows
          2026-09-01 to 2026-09-22 stay NULL. Predates the sales fact's EDW-23 certification.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "record_source_table = 'silver_kpi_inventory_value'"

  - name: v_current_inventory
    description: >
      Latest snapshot per product + warehouse + status, company-owned scope
      (REF_INVENTORY_STATUS include_in_std_metrics_flag = 1) and stocked items only
      (REF_STOCKING_POLICY: MADE_TO_ORDER items carry a seeded placeholder quantity that is not
      stock and are left out, EDW-144), with DIM_PRODUCT and DIM_WAREHOUSE attributes (spec 5.1).
      Always inside the native window. Rows at the unknown product member (product_key '-1',
      EDW-151) are kept, read that member's attributes from DIM_PRODUCT, and are reported as a DQ
      exception. Supply columns are returned unchanged at item + warehouse grain on the rank-1
      status row (spec 2.6).
    columns:
      - name: stocking_policy
        description: >
          From REF_STOCKING_POLICY on product_id, STOCKED when the item has no row there. Always
          STOCKED in this view; exposed so the scope is visible to the consumer.
        tests:
          - accepted_values:
              arguments:
                values: ['STOCKED']

  - name: v_metrics_inventory_daily
    description: >
      Primary certified inventory metric view (spec 5.2): DAILY grain, every snapshot date,
      company-owned scope. Carries record_source_table as the seam label; the backfill window has
      a different population and cadence (weekly through 2025) and a different cost basis, so a
      trend across 2026-09-01 steps as an artefact. Sparse where spec 2.7 records a gap.
      Stocked items only: MADE_TO_ORDER items (REF_STOCKING_POLICY, EDW-144) are left out on
      every date, matched on product_id and, for backfill rows that carry no product_id, on UPC.
      Demand metrics (EDW-51) use the trailing 90 days before snapshot_date (var
      inventory_demand_window_days) of FACT_SALES_INVOICE, net of returns, on product_key +
      warehouse_key; NULL where either key is unresolved (product_key '-1' counts as unresolved). Item + warehouse metrics repeat on each
      status row, so do not sum them across status rows. excess_inventory_flag (ruling I4,
      2026-10-07, EDW-172) is 1 when item + warehouse available stock is above
      trailing_units_sold_365 (net units in the 365 days before snapshot_date) or nothing sold
      in those 365 days; an item first sold under 180 days before snapshot_date is not assessed
      (0). excess_qty is the units above that one-year line, spread over the pair's status rows
      by positive available_qty, so it can be summed. Demand stays net of returns, floored at
      zero (ruling I5). inventory_turnover (EDW-182, I6) is annualized trailing COGS at D365's
      posted cost (FACT_SALES_INVOICE.moving_avg_cost_amount) over the average on-hand
      moving_avg_cost_amount at snapshot points from the row's own branch only (the branches
      differ in population and cadence at the seam), leaving out points where stock has no cost. below_safety_stock_flag compares item + warehouse available_qty
      to safety_stock_qty and is NULL where the item has no maintained safety stock (I2b);
      has_safety_stock_flag scopes the alert to covered items (Niles Costume today, EDW-126).
      reorder_flag is out of scope (I2c).
    columns:
      - name: stockout_flag
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: excess_inventory_flag
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: excess_qty
        tests:
          # I4: never negative, and zero wherever the flag is not set
          - dbt_utils.expression_is_true:
              name: v_metrics_inventory_daily_excess_qty_not_negative
              arguments:
                expression: ">= 0"
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              name: v_metrics_inventory_daily_excess_qty_zero_when_not_flagged
              arguments:
                expression: "= 0"
              config:
                where: "excess_inventory_flag = 0"
                severity: warn
      - name: below_safety_stock_flag
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: has_safety_stock_flag
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: v_partner_inventory
    description: >
      Latest position for partner-owned stock by program (spec 5.4): the inverse scope of the
      other two views (ownership_type = PARTNER_OWNED). Thin by design, no derived supply
      metrics. Same seam and cost-basis rules as the fact.