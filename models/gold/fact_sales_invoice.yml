version: 2

models:
  - name: fact_sales_invoice
    description: >
      FACT_SALES_INVOICE -- posted invoice-line grain, insert-only
      accumulating fact (D365 CustInvoiceTrans + CustInvoiceJour). See
      README.md for build status, known gaps, and open decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:  # 2026-09-16 (Chris review, EDW-23): fixed same day -- invoice_line_number (D365 LINENUM) is not unique per invoice_id (a single order line can explode into many CustInvoiceTrans rows across different products/qty under the same LINENUM), and source_system is constant 'D365' so it added no uniqueness. d365_invoice_rec_id (CustInvoiceTrans.RECID) is the true per-row identifier -- confirmed live 2026-09-16 (107,910 FAILs on the old combo, 0 on this one).
          combination_of_columns:
            - invoice_id
            - d365_invoice_rec_id
    columns:
      - name: sales_invoice_key
        tests: [is_valid_key]
      - name: invoice_id
        tests: [not_null]
      - name: invoice_line_number
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
              config:
                severity: warn  # 2026-09-16: -1 unresolved-to-barcode rows are
                # expected by design (same convention as fact_product_price),
                # which would always fail a hard relationships test.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (Chris review, item 3): never NULL
                            # since sales_channel_key is coalesced to -1 above
      - name: invoiced_qty
        tests: [not_null]
      - name: net_sales_amount
        tests: [not_null]

# Deferred, not implemented in this pass:
#   - Reconciliation rule 1 (spec Section 7): sum(net_sales_amount) by invoice_id
#     vs. D365 CustInvoiceJour.InvoiceAmount. Tolerance (F5, Open Decision 9) is
#     now adopted at zero (2026-08-27, EDW-63, ratified EDW-97) -- what still
#     blocks a real test is that CustInvoiceJour.InvoiceAmount itself isn't
#     ingested yet (not in bronze/silver_d365_cust_invoice_jour). Source it,
#     then this becomes a real test rather than an exploratory query.
#   - Reconciliation rule 2 / F5 cross-fact gate: sum(discount_amount) from
#     FACT_DISCOUNT_APPLICATION per sales_invoice_key vs. total_discount_amount
#     here. Zero tolerance also adopted (same F5 decision) -- still blocked on
#     FACT_DISCOUNT_APPLICATION not existing yet (EDW-65).
#   - header_discount_allocated (F1, Open Decision 1) is also adopted: pro-rata
#     by gross_sales_amount with a largest-remainder rule on the rounding
#     residual (2026-08-27, EDW-63, ratified EDW-97). Not implemented this pass
#     -- no header discount amount is sourced from CustInvoiceJour yet, so
#     header_discount_allocated stays null and total_discount_amount =
#     line_discount_amount only. Same basis will apply in
#     FACT_DISCOUNT_APPLICATION per spec 4.4 so the two can never disagree.
#   - V_METRICS_SALES_DAILY (Chris review, smaller item): Phase 1 view flagged
#     as "build right after the fact" -- not built this pass, needs its own
#     spec/shape decision with Nick before scoping.
#   - ~21K-line PRICEUNIT = 0 / no-discount residual under the new
#     QTY * LINEDISC line_discount_amount formula: unchased, see README.
