version: 2

models:
  - name: fact_sales_invoice
    description: >
      FACT_SALES_INVOICE -- posted invoice-line grain, insert-only
      accumulating fact (D365 CustInvoiceTrans + CustInvoiceJour). See
      README.md for build status, known gaps, and open decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:  # 2026-09-16 (Chris review, EDW-23): fixed same day -- invoice_line_number (D365 LINENUM) is not unique per invoice_id (a single order line can explode into many CustInvoiceTrans rows across different products/qty under the same LINENUM), and source_system is constant 'D365' so it added no uniqueness. d365_invoice_rec_id (CustInvoiceTrans.RECID) is the true per-row identifier -- confirmed live 2026-09-16 (107,910 FAILs on the old combo, 0 on this one).
          arguments:
            combination_of_columns:
              - invoice_id
              - d365_invoice_rec_id
      - dbt_utils.expression_is_true:  # EDW-169: USD lines carry a rate of 1
          arguments:
            expression: "fx_rate_to_usd = 1"
          config:
            where: "transaction_currency_code = 'USD'"
      - dbt_utils.expression_is_true:  # EDW-169: wholesale is net less Nimbly fee and commission
          arguments:
            expression: "wholesale_amount = net_sales_amount - nimbly_fee_amount - nimbly_commission_amount"
      - dbt_utils.expression_is_true:  # EDW-169: the same in USD; each term is rounded to 6 places on its own
          arguments:
            expression: "abs(wholesale_amount_usd - (net_sales_amount_usd - nimbly_fee_amount_usd - nimbly_commission_amount_usd)) <= 0.00001"
    columns:
      - name: sales_invoice_key
        tests: [is_valid_key]
      - name: invoice_id
        tests: [not_null]
      - name: d365_invoice_rec_id
        description: CustInvoiceTrans.RECID, the grain component with invoice_id (D365 reuses an invoice number across the credit memos issued against it). EDW-59.
        tests: [not_null, unique]
      - name: invoice_line_number
        tests: [not_null]
      - name: order_id
        description: Originating SALESID. NULL on free text lines (was a blank string before EDW-59).
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: customer_segment_key
        description: >
          DIM_CUSTOMER_SEGMENT key of the invoice account when the line was written, held on later
          merges while the customer is unchanged. History before EDW-59 reads the segment on the day
          of the refresh, and a full refresh restates it. NULL on the -1 customer. EDW-59.
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer_segment')
                field: customer_segment_key
              config:
                severity: warn  # same as the dim_customer test (EDW-132), error at a later pass
      - name: is_dso_order_flag
        description: >
          DIM_CUSTOMER is_dso_member_flag on the customer version in effect at the invoice date.
          Membership history starts with the first customer snapshot (Oct 14 2026); earlier invoices
          read that first version. EDW-59.
        tests:
          - not_null:
              config:
                severity: warn  # coverage: NULL only on the -1 customer, which no invoice line carries today
      - name: invoice_type
        description: Sales Order when the line has a SALESID, Free Text when it does not. EDW-59.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sales Order', 'Free Text']
      - name: is_return_flag
        description: True when invoiced_qty < 0 or net_sales_amount < 0, so a free text credit with no negative quantity reads as a return. EDW-59.
        tests: [not_null]
      - name: is_intercompany_flag
        description: >
          True when CustInvoiceJour.INTERCOMPANYPOSTED = 1 or the header's CUSTGROUP is Interco.
          Include with a flag, never a filter (spec 4.10). EDW-59.
        tests: [not_null]
      - name: payment_terms_code
        description: CustInvoiceJour.PAYMENT conformed to PREPAID, NET10, NET30, NET45, NET60; NULL when blank; UNKNOWN otherwise. EDW-59.
        tests:
          - accepted_values:
              arguments:
                values: ['PREPAID', 'NET10', 'NET30', 'NET45', 'NET60', 'UNKNOWN']
      - name: payment_mode_code
        description: SalesTable.PAYMMODE of the originating order as sourced; blank to NULL; NULL on free text lines. An attribute only. EDW-59.
        tests:
          - accepted_values:
              arguments:
                values: ['CC-BT', 'Credit', 'RevPoints', 'Check', 'ACH']
              config:
                severity: warn  # a tender D365 has not used before shows here without stopping the daily job
      - name: requested_ship_date
        description: SalesLine.SHIPPINGDATEREQUESTED through d365_sales_line_rec_id; placeholder dates read NULL (spec 7.6). NULL on free text lines. EDW-59.
      - name: gross_sales_amount
        description: invoiced_qty x unit_price on sales order lines; the line amount (LINEAMOUNT) on free text lines, where no discount applies (spec 4.9). EDW-59.
      # EDW-132 section 3 (folded into EDW-59): every date key relates to dim_date, at warn first. 0 orphans on Oct 15 2026.
      - name: invoice_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: order_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: ship_date_key
        description: Typed NULL; the source is not in silver (spec 4.16).
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
              config:
                severity: warn
      - name: unresolved_upc
        description: D365 barcode (UPC) that had no DIM_PRODUCT row, so product_key is -1. NULL when product_key resolved or no barcode exists. EDW-134.
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                severity: error  # EDW-134 (2026-10-05): every product_key now exists in dim_product ('-1' is a real member); was warn. Prior note: -1 unresolved-to-barcode rows are
                # expected by design (same convention as fact_product_price),
                # which would always fail a hard relationships test.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (Chris review, item 3): never NULL
                            # since sales_channel_key is coalesced to -1 above
      - name: invoiced_qty
        tests: [not_null]
      - name: net_sales_amount
        tests: [not_null]
      - name: fx_rate_to_usd
        description: Posted rate from the invoice header (CustInvoiceJour.EXCHRATE / 100), 1 on USD. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn  # coverage: a currency with no posted rate surfaces here without stopping the run
      - name: net_sales_amount_usd
        description: The line as booked in USD (CustInvoiceTrans.LINEAMOUNTMST). EDW-169.
        tests:
          - not_null:
              config:
                severity: warn
      - name: nimbly_fee_amount
        description: Nimbly website fee, SalesLine.REVWEBSITEFEE per unit x invoiced_qty through INVENTTRANSID; 0 with no sales line. Transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_commission_amount
        description: Nimbly commission, SalesLine.REVCOMMISSION per unit x invoiced_qty through INVENTTRANSID; 0 with no sales line. Transaction currency. EDW-169.
        tests: [not_null]
      - name: wholesale_amount
        description: net_sales_amount less Nimbly fee and commission, transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_fee_amount_usd
        description: nimbly_fee_amount x fx_rate_to_usd. EDW-169.
      - name: nimbly_commission_amount_usd
        description: nimbly_commission_amount x fx_rate_to_usd. EDW-169.
      - name: d365_sales_line_rec_id
        description: SalesLine RECID reached through INVENTTRANSID. Joins the invoice line to its order line on FACT_ORDER_LINE and FACT_ORDERS_RETURNS. NULL on free text lines and the few with no link. EDW-169.
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders_returns')
                field: d365_sales_line_rec_id
              config:
                severity: warn
      - name: custom_print_fee_amount
        description: Custom print fee, SalesLine.REVNETCUSTOMPRINTFEE (a line amount) x invoiced_qty / ordered quantity; 0 with no sales line. Informational, not taken off wholesale. EDW-169.
        tests: [not_null]
      - name: custom_print_fee_amount_usd
        description: custom_print_fee_amount x fx_rate_to_usd. EDW-169.
      - name: wholesale_amount_usd
        description: net_sales_amount_usd less the USD fee and commission; the basis of Wholesale Revenue. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn

# Reconciliation (spec Section 7), both zero tolerance (F5, ratified on EDW-97):
#   - Rule 1: sum(net_sales_amount) per CustInvoiceJour header equals SALESBALANCE --
#     tests/assert_fact_sales_invoice_reconciles_to_invoice_header.sql (EDW-59).
#   - Rule 2, the certified gate: sum(discount_amount) on FACT_DISCOUNT_APPLICATION per
#     sales_invoice_key equals total_discount_amount --
#     tests/assert_discount_application_reconciles_to_invoice.sql (PR #104).
# Not built, by design:
#   - header_discount_allocated (F1, ratified): pro-rata by gross_sales_amount, largest
#     remainder. Typed NULL while CustInvoiceJour.ENDDISC is zero on every header.
#   - Free text lines (no item, PRICEUNIT = 0) are classified by invoice_type and carry the
#     line amount as gross (EDW-59). The few sales order lines where gross less discount does
#     not equal net (82 in October 2026) are a known residual recorded in the spec, not a rule.