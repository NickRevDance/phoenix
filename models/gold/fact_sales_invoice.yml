version: 2

models:
  - name: fact_sales_invoice
    description: >
      FACT_SALES_INVOICE -- posted invoice-line grain, insert-only
      accumulating fact (D365 CustInvoiceTrans + CustInvoiceJour). See
      README.md for build status, known gaps, and open decisions.
    tests:
      - dbt_utils.unique_combination_of_columns:  # 2026-09-16 (Chris review, EDW-23): fixed same day -- invoice_line_number (D365 LINENUM) is not unique per invoice_id (a single order line can explode into many CustInvoiceTrans rows across different products/qty under the same LINENUM), and source_system is constant 'D365' so it added no uniqueness. d365_invoice_rec_id (CustInvoiceTrans.RECID) is the true per-row identifier -- confirmed live 2026-09-16 (107,910 FAILs on the old combo, 0 on this one).
          arguments:
            combination_of_columns:
              - invoice_id
              - d365_invoice_rec_id
      - dbt_utils.expression_is_true:  # EDW-169: USD lines carry a rate of 1
          arguments:
            expression: "fx_rate_to_usd = 1"
          config:
            where: "transaction_currency_code = 'USD'"
      - dbt_utils.expression_is_true:  # EDW-169: wholesale is net less Nimbly fee and commission
          arguments:
            expression: "wholesale_amount = net_sales_amount - nimbly_fee_amount - nimbly_commission_amount"
      - dbt_utils.expression_is_true:  # EDW-169: the same in USD; each term is rounded to 6 places on its own
          arguments:
            expression: "abs(wholesale_amount_usd - (net_sales_amount_usd - nimbly_fee_amount_usd - nimbly_commission_amount_usd)) <= 0.00001"
    columns:
      - name: sales_invoice_key
        tests: [is_valid_key]
      - name: invoice_id
        tests: [not_null]
      - name: invoice_line_number
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: unresolved_upc
        description: D365 barcode (UPC) that had no DIM_PRODUCT row, so product_key is -1. NULL when product_key resolved or no barcode exists. EDW-134.
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
              config:
                severity: error  # EDW-134 (2026-10-05): every product_key now exists in dim_product ('-1' is a real member); was warn. Prior note: -1 unresolved-to-barcode rows are
                # expected by design (same convention as fact_product_price),
                # which would always fail a hard relationships test.
      - name: sales_channel_key
        tests: [not_null]  # 2026-09-16 (Chris review, item 3): never NULL
                            # since sales_channel_key is coalesced to -1 above
      - name: invoiced_qty
        tests: [not_null]
      - name: net_sales_amount
        tests: [not_null]
      - name: fx_rate_to_usd
        description: Posted rate from the invoice header (CustInvoiceJour.EXCHRATE / 100), 1 on USD. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn  # coverage: a currency with no posted rate surfaces here without stopping the run
      - name: net_sales_amount_usd
        description: The line as booked in USD (CustInvoiceTrans.LINEAMOUNTMST). EDW-169.
        tests:
          - not_null:
              config:
                severity: warn
      - name: nimbly_fee_amount
        description: Nimbly website fee, SalesLine.REVWEBSITEFEE per unit x invoiced_qty through INVENTTRANSID; 0 with no sales line. Transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_commission_amount
        description: Nimbly commission, SalesLine.REVCOMMISSION per unit x invoiced_qty through INVENTTRANSID; 0 with no sales line. Transaction currency. EDW-169.
        tests: [not_null]
      - name: wholesale_amount
        description: net_sales_amount less Nimbly fee and commission, transaction currency. EDW-169.
        tests: [not_null]
      - name: nimbly_fee_amount_usd
        description: nimbly_fee_amount x fx_rate_to_usd. EDW-169.
      - name: nimbly_commission_amount_usd
        description: nimbly_commission_amount x fx_rate_to_usd. EDW-169.
      - name: d365_sales_line_rec_id
        description: SalesLine RECID reached through INVENTTRANSID. Joins the invoice line to its order line on FACT_ORDER_LINE and FACT_ORDERS_RETURNS. NULL on free text lines and the few with no link. EDW-169.
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders_returns')
                field: d365_sales_line_rec_id
              config:
                severity: warn
      - name: custom_print_fee_amount
        description: Custom print fee, SalesLine.REVNETCUSTOMPRINTFEE (a line amount) x invoiced_qty / ordered quantity; 0 with no sales line. Informational, not taken off wholesale. EDW-169.
        tests: [not_null]
      - name: custom_print_fee_amount_usd
        description: custom_print_fee_amount x fx_rate_to_usd. EDW-169.
      - name: wholesale_amount_usd
        description: net_sales_amount_usd less the USD fee and commission; the basis of Wholesale Revenue. EDW-169.
        tests:
          - not_null:
              config:
                severity: warn

# Deferred, not implemented in this pass:
#   - Reconciliation rule 1 (spec Section 7): sum(net_sales_amount) by invoice_id
#     vs. D365 CustInvoiceJour.InvoiceAmount. Tolerance (F5, Open Decision 9) is
#     now adopted at zero (2026-08-27, EDW-63, ratified EDW-97) -- what still
#     blocks a real test is that CustInvoiceJour.InvoiceAmount itself isn't
#     ingested yet (not in bronze/silver_d365_cust_invoice_jour). Source it,
#     then this becomes a real test rather than an exploratory query.
#   - Reconciliation rule 2 / F5 cross-fact gate: sum(discount_amount) from
#     FACT_DISCOUNT_APPLICATION per sales_invoice_key vs. total_discount_amount
#     here. Zero tolerance also adopted (same F5 decision) -- still blocked on
#     FACT_DISCOUNT_APPLICATION not existing yet (EDW-65).
#   - header_discount_allocated (F1, Open Decision 1) is also adopted: pro-rata
#     by gross_sales_amount with a largest-remainder rule on the rounding
#     residual (2026-08-27, EDW-63, ratified EDW-97). Not implemented this pass
#     -- no header discount amount is sourced from CustInvoiceJour yet, so
#     header_discount_allocated stays null and total_discount_amount =
#     line_discount_amount only. Same basis will apply in
#     FACT_DISCOUNT_APPLICATION per spec 4.4 so the two can never disagree.
#   - V_METRICS_SALES_DAILY (Chris review, smaller item): Phase 1 view flagged
#     as "build right after the fact" -- not built this pass, needs its own
#     spec/shape decision with Nick before scoping.
#   - ~21K-line PRICEUNIT = 0 / no-discount residual under the new
#     QTY * LINEDISC line_discount_amount formula: unchased, see README.