version: 2

sources:
  - name: dwhvisualnext
    database: dwhvisualnext
    schema: analytics
    tables:
      - name: centric_product
        identifier: d_centricproduct

      - name: kpi_inventory_value
        identifier: f_KPI_InventoryValue

  - name: byod
    database: dwhvisualnext
    schema: d365_byod
    tables:
      - name: d365_item_barcode
        identifier: Rev_InventItembarcodeStaging

      - name: d365_inventory_combinations
        identifier: Rev_InventDimCombinationStaging

      - name: d365_inventory_item
        identifier: Rev_InventTableStaging

      - name: d365_inventory_module
        identifier: Rev_InventTableMODUleStaging

      - name: d365_product_variant
        identifier: Rev_EcoResDistinctProductVariantStaging

      - name: d365_inventory_on_hand
        identifier: InventWarehouseInventoryStatusOnHandV2Staging

      - name: d365_hts_assignment
        identifier: REVCodesAssignmentStaging

      - name: d365_warehouse_location
        identifier: Rev_WMSLocationStaging

      - name: d365_inventory_trans
        identifier: Rev_InventTransStaging

      - name: d365_inventory_sum
        identifier: Rev_InventSumStaging

      - name: d365_inventory_dim
        identifier: Rev_InventDimStaging

      - name: d365_inventory_table
        identifier: Rev_InventTableStaging

      - name: d365_inventory_location
        identifier: Rev_InventLocationStaging

      - name: d365_inventory_site
        identifier: Rev_InventSiteStaging

      - name: d365_inventory_trans_origin
        identifier: Rev_InventTransOriginStaging

      - name: d365_inventory_table_module
        identifier: Rev_InventTableModuleStaging

      - name: d365_vendor
        identifier: Rev_VendTableStaging

      - name: d365_dir_party
        identifier: Rev_dirpartytablestaging

      - name: d365_price_disc_table
        identifier: Rev_PriceDiscTableStaging

      - name: d365_itm_cost_trans
        identifier: Rev_ItmCostTransStaging

      - name: d365_voyage_cost
        identifier: Rev_RevVoyageCostStaging

      - name: d365_customer
        identifier: Rev_CustTableStaging

      - name: d365_sales_table
        identifier: Rev_SalesTableStaging

      - name: d365_cust_invoice_jour
        identifier: Rev_CustInvoiceJourStaging

      - name: d365_cust_invoice_trans
        identifier: Rev_CustInvoiceTransStaging

      - name: d365_purch_line
        identifier: Rev_PurchLineStaging

      # Restored 2026-09-10 -- dropped by commit aa8454ab7 ("fact_sales_invoice"),
      # re-added here with the d365_ prefix per Nick's naming standardization request.
      - name: d365_itm_goods_in_transit_order
        identifier: Rev_ItmGoodsInTransitOrderStaging
        loaded_at_field: SYNCSTARTDATETIME
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

      # Renamed 2026-09-11 from d365_invent_transfer_line -- avoid shortening "inventory" to "invent"
      # in dbt object names going forward (per Nick's request). identifier/table unchanged.
      - name: d365_inventory_transfer_line
        identifier: Rev_InventTransferLineStaging
        loaded_at_field: SYNCSTARTDATETIME
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: bc
    database: dwhvisualnext
    schema: bc
    tables:
      - name: bc_customer
        identifier: customer_header

  - name: SFDC
    database: "{{ 'phoenix_prod_catalog' if target.schema == 'prod' else 'phoenix_dev_catalog' }}"
    schema: "{{ 'prod_raw' if target.schema == 'prod' else 'dev_raw' }}"
    tables:
      - name: sfdc_account
        identifier: sfdc_account
      - name: sfdc_case
        identifier: sfdc_case

  - name: dwhvisualnext_dimensions
    database: dwhvisualnext
    schema: dw
    tables:
      - name: date
        identifier: d_date

  - name: refs
    database: "{{ 'phoenix_prod_catalog' if target.schema == 'prod' else 'phoenix_dev_catalog' }}"
    schema: "{{ 'prod_raw' if target.schema == 'prod' else 'dev_raw' }}"
    tables:
      - name: ref_inventory_status
        identifier: ref_inventory_status
