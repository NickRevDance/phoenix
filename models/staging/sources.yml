      - name: warehouse_location
        identifier: Rev_WMSLocationStaging

      - name: inventory_trans
        identifier: Rev_InventTransStaging

      - name: inventory_sum
        identifier: Rev_InventSumStaging

      - name: inventory_dim
        identifier: Rev_InventDimStaging

      - name: inventory_table
        identifier: Rev_InventTable_Staging
      
      - name: inventory_location
        identifier: Rev_WHSInventFixedLocationStaging
    
