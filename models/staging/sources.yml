        identifier: lead

  # EDW-191: one-time copies of the old prod_raw SCD2 history, taken 2026-11-19 before the cutover.
  - name: SFDC_history
    database: phoenix_raw
    schema: manual
    tables:
      - name: sfdc_account_pre_cutover
        identifier: sfdc_account_scd2_20261119
      - name: sfdc_case_pre_cutover
        identifier: sfdc_case_scd2_20261119