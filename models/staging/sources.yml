      - name: sfdc_group_member
        identifier: groupmember
      - name: sfdc_queue_s_object
        identifier: queuesobject
      - name: sfdc_email_message
        identifier: emailmessage
      - name: sfdc_email_message_relation
        identifier: emailmessagerelation
      - name: sfdc_case_history
        identifier: casehistory
      - name: sfdc_case_comment
        identifier: casecomment
      - name: sfdc_case_contact_role
        identifier: casecontactrole
      - name: sfdc_case_status
        identifier: casestatus
      - name: sfdc_task
        identifier: task
      - name: sfdc_rma_c
        identifier: rma__c
      - name: sfdc_rma_line_c
        identifier: rmaline__c
      - name: sfdc_customer_user_c
        identifier: customeruser__c
      - name: sfdc_blend_c
        identifier: blend__c
      - name: sfdc_product2
        identifier: product2
      - name: sfdc_chargent_orders_chargent_order_c
        identifier: chargentorders__chargentorder__c
      - name: sfdc_chargent_order_item_c
        identifier: chargentorderitem__c
      - name: sfdc_campaign
        identifier: campaign
      - name: sfdc_campaign_member
        identifier: campaignmember
      - name: sfdc_opportunity
        identifier: opportunity
      - name: sfdc_sales_order_c
        identifier: sales_order__c
      - name: sfdc_sales_product_c
