version: 2

sources:
  - name: dwhvisualnext
    database: dwhvisualnext
    schema: analytics
    tables:
      - name: centric_product
        identifier: d_centricproduct

      - name: kpi_inventory_value
        identifier: f_KPI_InventoryValue

      # EDW-71: legacy annual budget by day and summary class, the Phase 1 budget source until Planful lands (EDW-30)
      - name: budget_sales_summary_class
        identifier: f_BudgetSalesWithSummaryClass

  # EDW-126 (decision I2a): legacy reflection feed, the source of record for D365 item coverage
  # safety stock until a BYOD item-coverage entity exists. Reloaded daily around 08:10 UTC.
  - name: d365_reflection
    database: dwhvisualnext
    schema: d365_reflection
    tables:
      - name: inventory_onhand
        config:
          loaded_at_field: SnapshotDateTime
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 54, period: hour}

  - name: byod
    database: dwhvisualnext
    schema: d365_byod
    tables:
      - name: d365_item_barcode
        identifier: Rev_InventItembarcodeStaging

      - name: d365_inventory_combinations
        identifier: Rev_InventDimCombinationStaging

      - name: d365_inventory_item
        identifier: Rev_InventTableStaging

      - name: d365_inventory_module
        identifier: Rev_InventTableMODUleStaging

      - name: d365_product_variant
        identifier: Rev_EcoResDistinctProductVariantStaging

      - name: d365_inventory_on_hand
        identifier: InventWarehouseInventoryStatusOnHandV2Staging

      - name: d365_hts_assignment
        identifier: REVCodesAssignmentStaging

      - name: d365_warehouse_location
        identifier: Rev_WMSLocationStaging

      - name: d365_inventory_trans
        identifier: Rev_InventTransStaging

      - name: d365_inventory_sum
        identifier: Rev_InventSumStaging

      - name: d365_inventory_dim
        identifier: Rev_InventDimStaging

      - name: d365_inventory_location
        identifier: Rev_InventLocationStaging

      - name: d365_inventory_site
        identifier: Rev_InventSiteStaging

      - name: d365_inventory_trans_origin
        identifier: Rev_InventTransOriginStaging

      - name: d365_inventory_table_module
        identifier: Rev_InventTableModuleStaging

      - name: d365_vendor
        identifier: Rev_VendTableStaging

      - name: d365_dir_party
        identifier: Rev_dirpartytablestaging

      # Added 2026-10-06 for DIM_VENDOR address (EDW-92). Party -> location link and the
      # date-effective postal address rows (LogisticsPostalAddress).
      - name: d365_dir_party_location
        identifier: Rev_DirPartyLocationStaging

      - name: d365_logistics_postal_address
        identifier: Rev_LogisticsPostalAddressStaging

      - name: d365_price_disc_table
        identifier: Rev_PriceDiscTableStaging

      - name: d365_itm_cost_trans
        identifier: Rev_ItmCostTransStaging

      - name: d365_voyage_cost
        identifier: Rev_RevVoyageCostStaging

      - name: d365_customer
        identifier: Rev_CustTableStaging

      - name: d365_sales_table
        identifier: Rev_SalesTableStaging

      - name: d365_cust_invoice_jour
        identifier: Rev_CustInvoiceJourStaging

      - name: d365_cust_invoice_trans
        identifier: Rev_CustInvoiceTransStaging

      - name: d365_purch_line
        identifier: Rev_PurchLineStaging

      # Added 2026-09-14 for FACT_PURCHASE_ORDER -- d365_purch_line (line
      # detail) was already registered 2026-09-10 for the inventory Phase 2
      # on_order_qty build; this is the matching header table.
      - name: d365_purch_table
        identifier: Rev_PurchTableStaging

      # Restored 2026-09-10 -- dropped by commit aa8454ab7 ("fact_sales_invoice"),
      # re-added here with the d365_ prefix per Nick's naming standardization request.
      - name: d365_itm_goods_in_transit_order
        identifier: Rev_ItmGoodsInTransitOrderStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      # Renamed 2026-09-11 from d365_invent_transfer_line -- avoid shortening "inventory" to "invent"
      # in dbt object names going forward (per Nick's request). identifier/table unchanged.
      - name: d365_inventory_transfer_line
        identifier: Rev_InventTransferLineStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_sales_line
        identifier: Rev_SalesLineStaging

      # Added 2026-09-15 for FACT_ORDERS_RETURNS -- D365's return-order
      # extension table (McrReturnSalesTable). No native ReturnTable exists
      # in this D365 instance; this add-on table is the closest equivalent,
      # joined to SalesTable via SALESTABLE = SalesTable.REC.
      - name: d365_mcr_return_sales_table
        identifier: Rev_mcrreturnsalestableStaging

      - name: d365_vend_packing_slip_trans
        identifier: Rev_VendPackingSlipTransStaging

      - name: d365_vend_invoice_trans
        identifier: Rev_VendInvoiceTransStaging

      # EDW-55: sales packing slips (true ship date and partial shipments) and WMS work lines (picked_qty)
      - name: d365_cust_packing_slip_trans
        identifier: Rev_custpackingsliptransStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_cust_packing_slip_jour
        identifier: Rev_CustPackingSlipJourStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_whs_work_line
        identifier: Rev_WHSWorkLineStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      
      # EDW-55: customer return reason codes (setup table, full export of ~33 rows)
      - name: d365_return_reason_code
        identifier: ReturnCustomerReturnReasonCodeStaging

      # EDW-69: WMS outbound shipments, shipment lines (load lines) and packed containers
      - name: d365_whs_shipment_table
        identifier: Rev_WHSShipmentTableStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_whs_load_line
        identifier: Rev_WHSLoadLineStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_whs_container_table
        identifier: Rev_WHSContainerTableStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_whs_container_line
        identifier: Rev_WHSContainerLineStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      # Added 2026-09-18 for FACT_PRODUCT_COST USD normalization (EDW-94
      # Phase 2). Native D365 ExchangeRate export -- monthly spot rates,
      # currently CAD->USD and GBP->USD only
      - name: d365_exchange_rate
        identifier: Rev_ExchangeRateStaging

      - name: d365_logistics_electronic_address
        identifier: Rev_LogisticsElectronicAddressStaging

      - name: d365_general_journal_entry
        identifier: Rev_GeneralJournalEntryStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

      - name: d365_general_journal_account_entry
        identifier: Rev_GeneralJournalAccountEntryStaging
        config:
          loaded_at_field: SYNCSTARTDATETIME
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}

  - name: d365_synapse
    description: >
      D365 F&O tables landed by Azure Synapse Link and the Lakeflow Connect
      pipeline d365_synapse_ingest. SCD type 2: one row per version, current
      rows have __END_AT IS NULL.
    database: phoenix_raw
    schema: d365
    tables:
      - name: custgroup
      - name: dlvmode
      - name: mainaccount

      - name: custtrans
        config:
          loaded_at_field: SinkModifiedOn
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}

      - name: markuptrans
        config:
          loaded_at_field: SinkModifiedOn
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}

      - name: taxtrans
        config:
          loaded_at_field: SinkModifiedOn
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}

      - name: purchtable
        config:
          loaded_at_field: SinkModifiedOn
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}

  - name: bc
    database: dwhvisualnext
    schema: bc
    tables:
      - name: bc_customer
        identifier: customer_header

      - name: bc_customer_group
        identifier: customergroups

  - name: dwhvisualnext_dimensions
    database: dwhvisualnext
    schema: dw
    tables:
      - name: date
        identifier: d_date

  - name: refs
    database: "{{ 'phoenix_prod_catalog' if target.schema == 'prod' else 'phoenix_dev_catalog' }}"
    schema: "{{ 'prod_raw' if target.schema == 'prod' else 'dev_raw' }}"
    tables:
      - name: ref_inventory_status
        identifier: ref_inventory_status

      - name: ref_product_summary_class
        identifier: ref_product_summary_class
  
  - name: dq_internal
    description: >
      Internal data-quality run history, written by the on-run-end hook
      (macros/log_test_run_results.sql), not a dbt-built model. Backs
      models/gold/v_dq_open_exceptions.sql and v_dq_exception_history.sql.
    schema: "{{ target.schema }}_dq_exceptions"
    tables:
      - name: dq_test_run_log
        description: One row per test per dbt invocation (pass/warn/fail/error).

  # EDW-191: Salesforce production, landed by sfdc_prod_ingest_phoenix_raw. Account and Case are SCD type 2.
  - name: SFDC
    database: phoenix_raw
    schema: salesforce
    tables:
